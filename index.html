const LabLayerLocator = ({ lang, t }) => {
  const zh = lang === 'zh';
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState({ right: 0, done: 0 });
  const item = LOCATOR_ITEMS[idx];
  const layerNames = zh
    ? ['裝置', '使用者', 'AI 平台', '帳號／WS', '工作介面', '工作模式', '工作容器', '任務', 'Context']
    : ['Device', 'User', 'Platform', 'Account/WS', 'Interface', 'Mode', 'Container', 'Task', 'Context'];

  const choose = (n) => {
    if (picked !== null) return;
    setPicked(n);
    setScore(s => ({ right: s.right + (n === _d(item.ans) ? 1 : 0), done: s.done + 1 }));
  };
  const next = () => { setPicked(null); setIdx(i => (i + 1) % LOCATOR_ITEMS.length); };
  const reset = () => { setPicked(null); setIdx(0); setScore({ right: 0, done: 0 }); };

  return (
    <LabCard title={t.mlab_labs[1].title} desc={t.mlab_labs[1].desc}>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <span className="text-xs text-slate-500">{zh ? '情境' : 'Scenario'} {idx + 1} / {LOCATOR_ITEMS.length}</span>
        <span className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5]">
          {zh ? '答對' : 'Correct'} {score.right} / {score.done}
        </span>
      </div>
      <div className="bg-slate-50 dark:bg-slate-900/50 rounded-xl p-4 border border-slate-200 dark:border-slate-700 mb-4">
        <p className="text-base leading-relaxed">{zh ? item.zh : item.en}</p>
      </div>
      <div className="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-4">
        {layerNames.map((nm, i) => {
          const n = i + 1;
          const isAns = picked !== null && n === _d(item.ans);
          const isWrongPick = picked === n && n !== _d(item.ans);
          return (
            <button key={n} onClick={() => choose(n)}
              className={`px-2 py-2 rounded-lg border text-xs transition-all
                ${isAns ? 'bg-green-100 dark:bg-green-900/30 border-green-500 text-green-700 dark:text-green-400 font-bold'
                  : isWrongPick ? 'bg-red-100 dark:bg-red-900/30 border-red-400 text-red-600 dark:text-red-400 font-bold'
                    : 'border-slate-300 dark:border-slate-600 hover:border-[#004030] dark:hover:border-[#D8C3A5]'}`}>
              <span className="block font-bold">{n}</span>
              <span className="block truncate">{nm}</span>
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div className={`rounded-xl p-4 border-l-4 mb-4 ${picked === _d(item.ans)
          ? 'border-green-500 bg-green-50 dark:bg-green-900/20' : 'border-red-400 bg-red-50 dark:bg-red-900/20'}`}>
          <p className={`text-sm font-bold mb-1 ${picked === _d(item.ans) ? 'text-green-700 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`}>
            {picked === _d(item.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {zh ? '正解：第 ' + _d(item.ans) + ' 層' : 'Answer: layer ' + _d(item.ans)}
          </p>
          <p className="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">{zh ? item.ezh : item.een}</p>
        </div>

      <div className="flex gap-3 flex-wrap">
        <button onClick={next} disabled={picked === null}

          {zh ? '下一題' : 'Next'}

const LabInventory = ({ lang, t }) => {
  const zh = lang === 'zh';
  const [inv, setInv] = useState(() => {
    try { const v = localStorage.getItem(LS_INV); return v ? JSON.parse(v) : {}; } catch { return {}; }
  });
  const [copied, setCopied] = useState('');

  useEffect(() => { try { localStorage.setItem(LS_INV, JSON.stringify(inv)); } catch (e) {} }, [inv]);

  const filled = INV_FIELDS.filter(f => (inv[f.k] || '').trim().length > 0).length;
  const pct = Math.round(filled / INV_FIELDS.length * 100);

  const buildMarkdown = () => {
    const head = zh ? '# 我的 AI 工作環境盤點（九層）' : '# My AI Work Environment Inventory (Nine Layers)';
    const empty = zh ? '（未填）' : '(not filled)';
    const lines = INV_FIELDS.map(f => `- **${zh ? f.zh : f.en}**: ${(inv[f.k] || '').trim() || empty}`);
    const tail = zh
      ? `\n> 完成度：${pct}%　·　來源：AIWE《AI 工作環境的層級模型》（駱世民教授）`
      : `\n> Completeness: ${pct}%  ·  Source: AIWE, The Layered Model of an AI Work Environment (Prof. Shihmin Lo)`;
    return [head, '', ...lines, tail].join('\n');
  };

  const copyMd = () => {
    const md = buildMarkdown();
    const done = () => { setCopied(zh ? '已複製到剪貼簿' : 'Copied to clipboard'); setTimeout(() => setCopied(''), 2000); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(md).then(done, () => fallback(md, done)); }
      else fallback(md, done);
    } catch (e) { fallback(md, done); }
  };
  const fallback = (text, done) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); done();
    } catch (e) { setCopied(zh ? '複製失敗，請手動選取' : 'Copy failed, please select manually'); }
  };

  const clearAll = () => {
    const msg = zh ? '確定要清除整份環境盤點表嗎？此操作無法復原，且重新整理後不會還原。'
      : 'Clear the entire environment inventory? This cannot be undone and will not be restored after a refresh.';
    if (!window.confirm(msg)) return;
    setInv({});
    try { localStorage.removeItem(LS_INV); } catch (e) {}
    setCopied(zh ? '已清除全部' : 'All cleared');
    setTimeout(() => setCopied(''), 2000);
  };

  const ClearBtn = () => (
    <button onClick={clearAll}
      className="px-4 py-2 rounded-lg text-sm font-bold border border-red-500 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
      {zh ? '🗑 清除全部' : '🗑 Clear all'}
    </button>
  );

  return (
    <LabCard title={t.mlab_labs[3].title} desc={t.mlab_labs[3].desc}>
      <div className="flex items-center justify-between gap-3 flex-wrap mb-4">
        <div className="flex-1 min-w-[200px]">
          <div className="flex justify-between text-xs text-slate-500 mb-1">
            <span>{zh ? '完成度' : 'Completeness'}</span><span className="font-bold">{filled} / {INV_FIELDS.length} · {pct}%</span>
          </div>
          <div className="w-full h-2.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
            <div className="h-full bg-[#004030] dark:bg-[#D8C3A5] transition-all" style={{ width: pct + '%' }} />
          </div>
        </div>
        <ClearBtn />
      </div>

      <div className="space-y-3">
        {INV_FIELDS.map(f => (
          <div key={f.k}>
            <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">{zh ? f.zh : f.en}</label>
            <input type="text" value={inv[f.k] || ''} maxLength={200}
              onChange={e => setInv(v => ({ ...v, [f.k]: sanitizeFree(e.target.value) }))}
              placeholder={zh ? f.pzh : f.pen}
              className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:outline-none focus:border-[#004030] dark:focus:border-[#D8C3A5]" />
          </div>
        ))}
      </div>

      <div className="flex items-center gap-3 mt-5 flex-wrap">
        <button onClick={copyMd}
          className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg text-sm">
          {zh ? '📋 複製成 Markdown 清單' : '📋 Copy as Markdown checklist'}
        </button>
        <ClearBtn />
        {copied && <span className="text-xs font-bold text-green-600 dark:text-green-400">{copied}</span>}
      </div>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-3">
        {zh ? '本表僅儲存在你自己的瀏覽器（localStorage），不會上傳；清除後重新整理也不會還原。'
          : 'This inventory is stored only in your own browser (localStorage), never uploaded, and clearing it survives a refresh.'}
      </p>
    </LabCard>
  );
};

/* ==================== App ==================== */
const APP_VER = '2026.08.22';
const MODULE_ICONS = ['📋', '🧭', '💻', '☁️', '🖥️', '📦', '🧠', '🔌', '⚗️', '🌐', '📊'];

const stripNum = (s) => String(s || '').replace(/^\s*\d+\s*[.、．]\s*/, '');

function App() {
  const LS_KEY = 'AIWE_SPA_analytics';
  const LS_STU = 'AIWE_SPA_student';
  const LS_VER = 'AIWE_SPA_version';
  const loadLS = (key, fb) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group: '', dept: '', id: '', nameEn: '', nameZh: '' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_KEY, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
    wrongTopics: {}
  }));
  const contentRef = useRef(null);
  const menuRef = useRef(null);
  const ttsRun = useRef(0);
  const t = dict[lang];

  const modulesList = useMemo(() => {
    const list = [{ id: 0, num: '0', icon: MODULE_ICONS[0], title: t.m0_title, nav: t.m0_nav }];
    for (let i = 1; i <= NUM_LEARN; i++) list.push({ id: i, num: String(i), icon: MODULE_ICONS[i], title: t[`m${i}_title`], nav: t[`m${i}_nav`] });
    list.push({ id: IDX_LAB, num: String(IDX_LAB), icon: MODULE_ICONS[IDX_LAB], title: t.mlab_title, nav: t.mlab_nav });
    list.push({ id: IDX_RES, num: String(IDX_RES), icon: MODULE_ICONS[IDX_RES], title: t.mres_title, nav: t.mres_nav });
    list.push({ id: IDX_ANA, num: String(IDX_ANA), icon: MODULE_ICONS[IDX_ANA], title: t.analytics_title, nav: t.analytics_title });
    return list;
  }, [lang]);

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(analytics)); } catch (e) {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch (e) {} }, [studentInfo]);

  /* 網頁更新 → 詢問是否刷新既有紀錄 */
  useEffect(() => {
    try {
      const prev = localStorage.getItem(LS_VER);
      if (prev && prev !== APP_VER) {
        if (window.confirm(dict[lang].analytics_refresh_prompt)) {
          localStorage.removeItem(LS_KEY);
          setAnalytics({
            time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
            quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
            cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
            wrongTopics: {}
          });
        }
      }
      localStorage.setItem(LS_VER, APP_VER);
    } catch (e) {}
  }, []);

  /* 停留時間累加（+=） */
  useEffect(() => {
    const id = setInterval(() => {
      setAnalytics(a => { const tm = [...a.time]; tm[module] = (tm[module] || 0) + 1; return { ...a, time: tm }; });
    }, 1000);
    return () => clearInterval(id);
  }, [module]);

  /* 互動點擊累加（+=） */
  const bumpClick = () => setAnalytics(a => { const c = [...a.clicks]; c[module] = (c[module] || 0) + 1; return { ...a, clicks: c }; });

  /* 漢堡外部點擊收合 */
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  /* 切換模組時停止語音 */
  useEffect(() => { try { speechSynthesis.cancel(); } catch (e) {} setTtsState('idle'); }, [module, lang]);

  const goModule = (id) => { setModule(id); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  /* ===== 測驗結果覆蓋原則：= 覆蓋 ===== */
  const handleQuizSubmit = (mid, correct, total, wrongQs, moduleName) => {
    setAnalytics(a => {
      const qc = [...a.quizCorrect], qt = [...a.quizTotal];
      qc[mid] = correct; qt[mid] = total;
      const wt = { ...a.wrongTopics }; wt[mid] = wrongQs || [];
      return { ...a, quizCorrect: qc, quizTotal: qt, wrongTopics: wt };
    });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => {
      const cr = [...a.cardsRead], ct = [...a.cardsTotal];
      cr[mid] = readCount; ct[mid] = totalCount;
      return { ...a, cardsRead: cr, cardsTotal: ct };
    });
  };

  /* ===== TTS ===== */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { ttsRun.current += 1; speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (action === 'play') {
      if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
      speechSynthesis.cancel();
      const sep = lang === 'zh' ? '。 ' : '. ';
      let texts = [];
      if (module === 0) {
        texts = [t.m0_title, t.subtitle, t.m0_intro, t.m0_why, t.m0_why_desc,
          t.orig_title, t.orig_cap,
          ...(t.m0_stats || []).map(s => `${s.label}: ${s.val}`),
          ...(t.m0_modules || []).map(m => `${m.title}. ${m.desc}`)
        ];
      } else if (module >= 1 && module <= NUM_LEARN) {
        const mk = `m${module}`;
        texts = [t[`${mk}_title`], t[`${mk}_overview`],
          ...(t[`${mk}_highlights`] || []),
          ...[1, 2, 3, 4, 5, 6, 7, 8].map(n => t[`${mk}_p${n}`]).filter(Boolean),
          t[`${mk}_wrapup`],
          ...(t[`${mk}_terms`] || []).flatMap(tm => [tm.front, tm.back])
        ];
      } else if (module === IDX_LAB) {
        texts = [t.mlab_title, t.mlab_desc, ...(t.mlab_labs || []).map(l => `${l.title}. ${l.desc || ''}`)];
      } else if (module === IDX_RES) {
        texts = [t.mres_title, t.mres_desc, t.mres_required,
          ...(t.mres_items_required || []).map(r => `${r.label}. ${r.desc}`),
          t.mres_optional,
          ...(t.mres_items_optional || []).map(r => `${r.label}. ${r.desc}`)];
      } else if (module === IDX_ANA) {
        const tc = analytics.quizCorrect.reduce((a, b) => a + b, 0);
        const ta = analytics.quizTotal.reduce((a, b) => a + b, 0);
        const oa = ta > 0 ? Math.round(tc / ta * 100) : 0;
        const wk = [];
        for (let i = 1; i <= NUM_LEARN; i++) {
          if (analytics.quizTotal[i] > 0) {
            const acc = Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100);
            if (acc < 75) wk.push({ name: modulesList[i].title, acc });
          }
        }
        wk.sort((a, b) => a.acc - b.acc);
        texts = [t.analytics_title, t.analytics_desc,
          `${t.analytics_total_time}: ${analytics.time.reduce((a, b) => a + b, 0)}${t.analytics_sec}`,
          `${t.analytics_total_clicks}: ${analytics.clicks.reduce((a, b) => a + b, 0)}${t.analytics_times}`,
          `${t.analytics_overall_acc}: ${oa}%`
        ];
        if (wk.length) { texts.push(t.analytics_wp_tts_intro); wk.forEach(w => texts.push(t.analytics_wp_tts_module.replace('{name}', w.name).replace('{acc}', w.acc))); }
        else if (ta > 0) texts.push(t.analytics_wp_tts_allpass);
      }
      texts = texts.filter(Boolean);
      /* 語音挑選：與課程既有 SPA 完全一致，不做任何更動 */
      const voices = speechSynthesis.getVoices();
      let voice = null, code = 'en-GB';
      if (lang === 'zh') {
        voice = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh')) || null;
        code = 'zh-TW';
      } else {
        voice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en')) || null;
        code = 'en-GB';
      }

      /* Chrome 對單一長 utterance 會靜默失敗（網路語音尤其明顯），因此切成短句依序播放 */
      const CHUNK = lang === 'zh' ? 140 : 190;
      const full = texts.join(sep);
      const sentences = (() => {
        const out = []; let cur = '';
        for (let i = 0; i < full.length; i++) {
          cur += full[i];
          const c = full[i];
          if ('。！？；!?;'.indexOf(c) >= 0 || (c === '.' && /\s|$/.test(full[i + 1] || ''))) { out.push(cur); cur = ''; }
        }
        if (cur.trim()) out.push(cur);
        return out;
      })();
      const packed = []; let acc = '';
      sentences.forEach(sent0 => {
        let sent = sent0;
        while (sent.length > CHUNK) {
          let cut = sent.lastIndexOf(' ', CHUNK);
          if (cut < CHUNK * 0.5) cut = CHUNK;
          if (acc) { packed.push(acc); acc = ''; }
          packed.push(sent.slice(0, cut));
          sent = sent.slice(cut);
        }
        if ((acc + sent).length > CHUNK) { if (acc) packed.push(acc); acc = sent; }
        else acc += sent;
      });
      if (acc.trim()) packed.push(acc);

      ttsRun.current += 1;
      const myRun = ttsRun.current;
      let qi = 0;
      const speakNext = () => {
        if (myRun !== ttsRun.current) return;
        if (qi >= packed.length) { setTtsState('idle'); return; }
        const u = new SpeechSynthesisUtterance(packed[qi++]);
        u.rate = 0.95;
        if (voice) u.voice = voice;
        u.lang = code;
        u.onend = speakNext;
        u.onerror = () => { if (myRun === ttsRun.current) speakNext(); };
        speechSynthesis.speak(u);
      };
      setTtsState('playing');
      setTimeout(speakNext, 60);
    }
  };

  /* ===== CSV 匯出（UTF-8 BOM） ===== */
  const csvReady = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;
  const exportCSV = () => {
    if (!csvReady) return;
    const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const head = ['Module No', 'Module Title (ZH)', 'Module Title (EN)', 'Time (sec)', 'Clicks',
      'Quiz Correct', 'Quiz Total', 'Accuracy (%)', 'Cards Read', 'Cards Total', 'Wrong Questions'];
    const zhList = dict.zh, enList = dict.en;
    const nameOf = (i, d) => {
      if (i === 0) return d.m0_title;
      if (i <= NUM_LEARN) return d[`m${i}_title`];
      if (i === IDX_LAB) return d.mlab_title;
      if (i === IDX_RES) return d.mres_title;
      return d.analytics_title;
    };
    const rows = [];
    for (let i = 0; i < TOTAL; i++) {
      const qt = analytics.quizTotal[i] || 0, qc = analytics.quizCorrect[i] || 0;
      rows.push([i, nameOf(i, zhList), nameOf(i, enList), analytics.time[i] || 0, analytics.clicks[i] || 0,
        qc, qt, qt > 0 ? Math.round(qc / qt * 100) : '', analytics.cardsRead[i] || 0, analytics.cardsTotal[i] || 0,
        (analytics.wrongTopics[i] || []).join(' | ')].map(esc).join(','));
    }
    const meta = [
      ['Group', studentInfo.group], ['Dept', studentInfo.dept], ['Student ID', studentInfo.id],
      ['Name (EN)', studentInfo.nameEn], ['Name (ZH)', studentInfo.nameZh],
      ['Exported At', new Date().toISOString()], ['Material', dict.zh.brand + ' ' + dict.zh.title], ['Version', APP_VER]
    ].map(r => r.map(esc).join(','));
    const csv = '﻿' + meta.join('\n') + '\n\n' + head.map(esc).join(',') + '\n' + rows.join('\n');
    const d = new Date();
    const stamp = '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    const fname = `${dict.zh.brand} ${dict.zh.title}_${studentInfo.nameEn} ${studentInfo.nameZh}_${stamp}.csv`;
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const clearAnalytics = () => {
    if (!window.confirm(t.analytics_wp_clear_confirm)) return;
    const blank = {

      quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
      cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),

  /* ===== 學習模組 ===== */
  const renderLearn = () => {
    const mk = `m${module}`;
    const Svg = MODULE_SVGS[module];
    const meta = modulesList[module];
    return (
      <div className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
        <H2 icon={meta.icon} number={meta.num}>{t[`${mk}_title`]}</H2>

        <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">

          <p>{t[`${mk}_overview`]}</p>
        </div>

        <div>
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.highlights_label}</h3>
          <div className="flex flex-wrap gap-2">
            {t[`${mk}_highlights`].map((h, i) => (
              <span key={i} className="px-3 py-1 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] rounded-full text-sm font-medium">{h}</span>

  /* ===== Analytics ===== */
  const renderAna = () => {
    const totalTime = analytics.time.reduce((a, b) => a + b, 0);
    const totalClicks = analytics.clicks.reduce((a, b) => a + b, 0);
    const tc = analytics.quizCorrect.reduce((a, b) => a + b, 0);
    const ta = analytics.quizTotal.reduce((a, b) => a + b, 0);
    const overallAcc = ta > 0 ? Math.round(tc / ta * 100) : 0;
    const cr = analytics.cardsRead.reduce((a, b) => a + b, 0);
    const ct = analytics.cardsTotal.reduce((a, b) => a + b, 0);
    const cardUsage = ct > 0 ? Math.round(cr / ct * 100) : 0;

    const weak = [];
    for (let i = 1; i <= NUM_LEARN; i++) {
      if (analytics.quizTotal[i] > 0) {
        const acc = Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100);
        if (acc < 75) weak.push({ id: i, name: modulesList[i].title, acc, wrong: analytics.wrongTopics[i] || [] });
      }
    }
    weak.sort((a, b) => a.acc - b.acc);

    const stats = [
      { v: totalTime + t.analytics_sec, l: t.analytics_total_time, i: <IconActivity size={18} /> },
      { v: totalClicks + t.analytics_times, l: t.analytics_total_clicks, i: <IconZap size={18} /> },
      { v: overallAcc + '%', l: t.analytics_overall_acc, i: <IconTrendingUp size={18} /> },
      { v: cardUsage + '%', l: t.analytics_card_usage, i: <IconLayers size={18} /> }
    ];

    const nameOf = (i) => modulesList[i].title;

    return (
      <div className="space-y-6 animate-fade-in">
        <H2 icon={MODULE_ICONS[IDX_ANA]} number={String(IDX_ANA)}>{t.analytics_title}</H2>
        <p className="text-lg leading-relaxed text-slate-700 dark:text-slate-300">{t.analytics_desc}</p>
        <p className="text-xs text-green-600 dark:text-green-400 font-bold">💾 {t.analytics_wp_saved}</p>

        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          {stats.map((s, i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
              <div className="text-[#D8C3A5] mb-2">{s.i}</div>
              <p className="font-serif font-black text-2xl sm:text-3xl text-[#004030] dark:text-[#D8C3A5]">{s.v}</p>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">{s.l}</p>
            </div>
          ))}
        </div>

        {/* 整體學習進度 */}
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_progress_title}</h3>
          <div className="space-y-2">
            {Array.from({ length: NUM_LEARN }).map((_, k) => {
              const i = k + 1;
              const visited = (analytics.time[i] || 0) > 0;
              const quizDone = (analytics.quizTotal[i] || 0) > 0;
              const acc = quizDone ? Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100) : 0;
              return (
                <button key={i} onClick={() => goModule(i)}
                  className="w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
                  <span className="w-6 text-xs font-bold text-slate-400">{i}</span>
                  <span className="flex-1 text-sm truncate">{nameOf(i)}</span>
                  <span className={`text-[10px] px-2 py-0.5 rounded-full shrink-0 ${visited
                    ? 'bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-400'
                    : 'bg-slate-100 dark:bg-slate-700 text-slate-500'}`}>
                    {visited ? t.analytics_progress_visited : t.analytics_progress_not_visited}
                  </span>
                  {quizDone && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#004030]/10 dark:bg-[#D8C3A5]/20 text-[#004030] dark:text-[#D8C3A5] shrink-0">
                      {t.analytics_progress_quiz_done} {acc}%
                    </span>
                  )}
                  <span className="hidden sm:block w-24 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0">
                    <span className="block h-full bg-[#004030] dark:bg-[#D8C3A5]" style={{ width: (quizDone ? acc : (visited ? 15 : 0)) + '%' }} />
                  </span>
                </button>
              );
            })}
          </div>
        </div>

        {/* 弱點分析 */}
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_wp_title}</h3>
          {weak.length === 0 ? (
            <p className="text-sm text-green-600 dark:text-green-400 flex items-center gap-2"><IconCheckCircle size={16} />{t.analytics_wp_allpass}</p>
          ) : (
            <div className="space-y-4">
              {weak.map(w => (
                <div key={w.id} className="border-l-4 border-red-400 bg-red-50 dark:bg-red-900/20 rounded-r-xl p-4">
                  <p className="font-bold text-sm text-red-600 dark:text-red-400 mb-1">{w.name} — {w.acc}%</p>
                  {w.wrong.length > 0 && (
                    <div className="mt-2">
                      <p className="text-xs font-bold text-slate-500 mb-1">{t.analytics_wp_incorrect}</p>
                      <ul className="space-y-1">
                        {w.wrong.map((q, j) => <li key={j} className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">· {q}</li>)}
                      </ul>
                    </div>
                  )}
                  <button onClick={() => goModule(w.id)} className="mt-2 text-xs font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline">
                    {t.analytics_wp_goto}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* 各模組明細 */}
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_detail_title}</h3>
          <div className="w-full overflow-x-auto">
            <table className="w-full text-xs min-w-[640px]">
              <thead>
                <tr className="text-left text-slate-500 border-b border-slate-200 dark:border-slate-700">
                  <th className="py-2 pr-3">{t.analytics_module}</th>
                  <th className="py-2 px-2">{t.analytics_time}</th>
                  <th className="py-2 px-2">{t.analytics_clicks}</th>
                  <th className="py-2 px-2">{t.analytics_cards_read_total}</th>
                  <th className="py-2 px-2">{t.analytics_correct_ans_total}</th>
                  <th className="py-2 pl-2">{t.analytics_acc}</th>
                </tr>
              </thead>
              <tbody>
                {Array.from({ length: TOTAL }).map((_, i) => {
                  const qt = analytics.quizTotal[i] || 0, qc = analytics.quizCorrect[i] || 0;
                  return (
                    <tr key={i} className="border-b border-slate-100 dark:border-slate-700/50">
                      <td className="py-2 pr-3"><span className="text-slate-400 mr-1">{i}.</span>{nameOf(i)}</td>
                      <td className="py-2 px-2">{analytics.time[i] || 0}{t.analytics_sec}</td>
                      <td className="py-2 px-2">{analytics.clicks[i] || 0}{t.analytics_times}</td>
                      <td className="py-2 px-2">{analytics.cardsRead[i] || 0} / {analytics.cardsTotal[i] || 0}</td>
                      <td className="py-2 px-2">{qt > 0 ? `${qc} / ${qt} / ${qt}` : t.analytics_no_data}</td>
                      <td className="py-2 pl-2 font-bold">{qt > 0 ? Math.round(qc / qt * 100) + '%' : '—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* 基本資料 + CSV */}
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_form_title}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_group}</label>
              <select value={studentInfo.group} onChange={e => setStudentInfo(s => ({ ...s, group: e.target.value }))}
                className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900">
                <option value="">{t.analytics_group_select}</option>
                {t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_dept}</label>
              <input type="text" value={studentInfo.dept} placeholder={t.analytics_dept_ph} maxLength={20}
                onChange={e => setStudentInfo(s => ({ ...s, dept: sanitizeDept(e.target.value) }))}
                className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900" />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_id}</label>
              <input type="text" inputMode="numeric" value={studentInfo.id} placeholder={t.analytics_id_ph} maxLength={12}
                onChange={e => setStudentInfo(s => ({ ...s, id: sanitizeStudentId(e.target.value) }))}
                className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900" />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_name_en}</label>
              <input type="text" value={studentInfo.nameEn} placeholder={t.analytics_name_en_ph} maxLength={50}
                onChange={e => setStudentInfo(s => ({ ...s, nameEn: sanitizeName(e.target.value) }))}
                className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900" />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_name_zh}</label>
              <input type="text" value={studentInfo.nameZh} placeholder={t.analytics_name_zh_ph} maxLength={50}
                onChange={e => setStudentInfo(s => ({ ...s, nameZh: sanitizeName(e.target.value) }))}
                className="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900" />
            </div>
          </div>
          <div className="flex items-center gap-3 mt-5 flex-wrap">
            <button onClick={exportCSV} disabled={!csvReady}
              className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg text-sm disabled:opacity-40">
              {t.analytics_export_csv}
            </button>
            {!csvReady && <span className="text-xs text-slate-500">{t.analytics_fill_required}</span>}
            <button onClick={clearAnalytics}
              className="px-5 py-2 rounded-lg text-sm font-bold border border-red-500 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">
              {t.analytics_wp_clear}
            </button>
          </div>
        </div>
        <BottomNav />
      </div>
    );
  };

  const renderBody = () => {
    if (module === 0) return renderM0();
    if (module >= 1 && module <= NUM_LEARN) return renderLearn();
    if (module === IDX_LAB) return renderLab();
    if (module === IDX_RES) return renderRes();
    return renderAna();
  };

  const sidebarIcon = (m) => {
    if (m.id === IDX_LAB) return <IconZapLab size={16} />;
    if (m.id === IDX_RES) return <IconGlobe size={16} />;
    if (m.id === IDX_ANA) return <IconActivity size={16} />;
    return <span className="text-base ui-decoration" aria-hidden="true">{m.icon}</span>;
  };

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden" onClick={bumpClick}>
      {/* HEADER */}
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} aria-label={t.nav_modules}
                className="p-2 hover:bg-white/10 rounded-lg">{menuOpen ? <IconX /> : <IconMenu />}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-64 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto
                  bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100] py-2">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => goModule(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left transition-all
                        ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/15 text-[#004030] dark:text-[#D8C3A5] font-bold'
                          : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span className="text-base ui-decoration shrink-0" aria-hidden="true">{m.icon}</span>
                      <span className="text-xs font-bold text-slate-400 shrink-0 w-4">{m.num}</span>
                      <span className="truncate">{stripNum(m.nav || m.title)}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => { setModule(0); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
              aria-label={t.nav_home} className="p-2 hover:bg-white/10 rounded-lg"><IconHome size={18} /></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest shrink-0">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} aria-label={t.audio_read}
              className="p-2 hover:bg-white/10 rounded-lg">{ttsState === 'playing' ? <IconPause /> : <IconPlay />}</button>
            <button onClick={() => handleTTS('stop')} aria-label="Stop" className="p-2 hover:bg-white/10 rounded-lg"><IconSquare /></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')}
              className="px-2 sm:px-3 py-1.5 text-xs font-bold border border-[#D8C3A5]/50 rounded-lg hover:bg-white/10">
              {lang === 'en' ? '中文' : 'EN'}
            </button>
            <button onClick={() => setIsDark(!isDark)} aria-label="Theme" className="p-2 hover:bg-white/10 rounded-lg">
              {isDark ? <IconSun /> : <IconMoon />}
            </button>
          </div>
        </div>
      </header>

      {/* BODY */}
      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <div className="sticky top-24 space-y-1">
            <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2">{t.nav_modules}</p>
            {modulesList.map(m => (
              <button key={m.id} onClick={() => goModule(m.id)}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left transition-all
                  ${module === m.id ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold'
                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                <span className="shrink-0 flex items-center justify-center w-5">{sidebarIcon(m)}</span>
                <span className="text-[11px] font-bold opacity-60 shrink-0 w-3">{m.num}</span>
                <span className="truncate text-[13px]">{m.title}</span>
              </button>
            ))}
          </div>
        </aside>
        <main ref={contentRef} className="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-8">
          {renderBody()}
        </main>
      </div>

      {/* FOOTER */}
      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;
            <a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a>
          </span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
