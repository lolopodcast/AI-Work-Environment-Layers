/* ============ 版權提示 Toast ============ */
var COPYRIGHT_MSG = 'Intellectual Property of Prof. Shihmin Lo';
var _cwToastTimer = null;
function showCopyrightToast(msg) {
  var el = document.getElementById('cw-toast');
  if (!el) return;
  el.innerHTML = DOMPurify.sanitize('&copy; ' + (msg || COPYRIGHT_MSG));
  el.classList.add('show');
  if (_cwToastTimer) clearTimeout(_cwToastTimer);
  _cwToastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
}
window.showCopyrightToast = showCopyrightToast;

/* ============ 智慧型右鍵與快捷鍵攔截 ============ */
document.addEventListener('contextmenu', function (e) {
  var selection = (window.getSelection() ? window.getSelection().toString() : '').trim();
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  var isForm = (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  if (isForm) return true;
  if (selection.length > 0) return true;   /* 有反白 → 允許（查字典 / 複製筆記） */
  e.preventDefault();
  showCopyrightToast();
});

document.addEventListener('keydown', function (e) {
  var k = (e.key || '').toLowerCase();
  if (e.key === 'F12') { e.preventDefault(); showCopyrightToast(); return; }
  if (e.ctrlKey && !e.shiftKey && k === 'u') { e.preventDefault(); showCopyrightToast(); return; }
  if (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].indexOf(k) !== -1) { e.preventDefault(); showCopyrightToast(); return; }
  /* Ctrl+P（列印）與 Ctrl+S（存檔）刻意開放，確保學生可離線複習 */
});

document.addEventListener('dragstart', function (e) {
  var tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
  if (tag === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault();
});

/* ============ DOMPurify 安全包裝（動態 HTML 插入用） ============ */
window.safeHTML = function (raw) {
  try { return DOMPurify.sanitize(String(raw)); }
  catch (err) { return ''; }
};

  /* ===== M1 ===== */
  m1_nav: "1. 為什麼要分層：三種空間",
  m1_title: "為什麼要分層：三種空間",
  m1_overview: "在拆解九個層級之前，先把整張圖的三色圖例學起來。藍色是 AI 雲端空間，跟帳號與 workspace 走；橘色是本機空間，跟某一台電腦和某一個路徑走；綠色是雲端硬碟同步，本質上是本機資料夾再加上跨裝置同步。幾乎所有「我的東西不見了」的抱怨，都可以還原成一句話：你以為它是藍色，其實它是橘色。",
  m1_highlights: ["三種空間", "藍：AI 雲端", "橘：本機", "綠：雲端硬碟同步", "帳號 ≠ 檔案", "分層診斷"],
  m1_p1: "藍色的 AI 雲端空間，是平台幫你保管的東西：聊天紀錄、專案空間、上傳到專案裡的參考檔案、自訂指示。它的識別依據是「你用哪一個帳號、在哪一個 workspace 登入」。只要帳號與 workspace 相同，你換手機、換筆電、換瀏覽器，通常都還看得到它。這就是為什麼很多人會產生「AI 記得我」的直覺——它記得的是雲端紀錄，不是你的硬碟。",
  m1_p2: "橘色的本機空間，是你自己那台電腦上的資料夾與檔案，例如 D:\\Research 或 C:\\Users\\jimmy\\Documents\\PMCS。它的識別依據是「哪一台機器 + 哪一個路徑」。AI 要能讀它，必須同時滿足三個條件：你用的是能碰檔案的介面與模式、那台機器就在你面前、而且你已經授權那個路徑。換一台電腦，橘色的東西不會自己跟過去。",
  m1_p3: "綠色的雲端硬碟同步，是橘色的一個特例：它仍然是本機資料夾，只是背後多了 OneDrive、Google Drive、iCloud 之類的同步服務，把同一份內容鋪到你其他裝置上。它的好處是「跨裝置有機會延續」，代價是路徑在不同機器上長得不一樣，而且同步有延遲、有衝突副本。綠色不是藍色：AI 平台並沒有因此就看得到它，你仍然要在另一台機器上重新指定路徑。",
  m1_p4: "分層的價值在於把模糊的抱怨變成可診斷的問題。「它忘記了」可能是三件完全不同的事：可能你換了帳號（第 4 層），可能你開了一個新任務（第 8 層），也可能只是這一輪對話太長被壓縮了（第 9 層）。這三種情況的處理方式南轅北轍。學會先問「這是第幾層的問題」，你才有辦法在三十秒內找到對的解法，而不是無效地重問模型「你怎麼又忘了」。",
  m1_wrapup: "三種顏色是本教材的共同語言，後面每一層都會回頭標記它屬於藍、橘還是綠。請記住最簡單的判準：問「這東西的識別依據是帳號，還是機器路徑？」答案是帳號就是藍色，答案是路徑就是橘色，答案是路徑但又會自動同步就是綠色。當你能替自己手上每一份工作標上顏色，你就已經完成了 AI 環境素養的第一步，後面八個層級只是把這個判準用得更細。",

    { front: "AI 雲端空間（藍）", back: "由 AI 平台保管、跟帳號與 workspace 走的空間：聊天紀錄、專案、專案內檔案與自訂指示。" },

    { front: "雲端硬碟同步（綠）", back: "本機資料夾加上 OneDrive／Google Drive 之類的同步服務，可跨裝置延續，但路徑仍隨機器而異。" },
    { front: "識別依據", back: "判斷一個東西屬於哪一種空間的關鍵問題：它是靠帳號被找到，還是靠機器與路徑被找到？" },
    { front: "分層診斷", back: "把「它忘記了」這類症狀，還原成第幾層出問題的方法，讓解法有明確對象。" },
    { front: "第一個誤解", back: "把「AI 記得我」（藍色的雲端紀錄）誤解成「我的檔案在雲端」（其實是橘色的本機檔案）。" }
  ],
  m1_q: [
    { q: "在本教材的三色圖例中，藍色代表什麼？", opts: ["AI 雲端空間，跟帳號與 workspace 走", "跟著某一台電腦與某一個特定路徑走的本機資料夾與檔案", "由 OneDrive 之類同步服務鋪開的本機資料夾", "模型在這一輪對話當下真正看得見的上下文內容"], ans: _A0, exp: "藍色＝AI 雲端空間，識別依據是帳號與 workspace。" },
    { q: "橘色的本機空間，識別依據是什麼？", opts: ["你目前所購買的訂閱方案等級", "哪一台機器加上哪一個路徑", "當下使用的瀏覽器品牌與版本", "這一輪對話已累積的長度"], ans: _A1, exp: "橘色靠「機器＋路徑」被找到，所以換機器就會斷。" },
    { q: "關於綠色的雲端硬碟同步，下列何者正確？", opts: ["它等同於 AI 雲端空間，只要登入同一帳號就自動看得到", "它是本機資料夾加上跨裝置同步，仍需在新機器重新指定路徑", "它完全不需要本機資料夾，內容只存在同步服務的雲端", "它只能在行動裝置上運作，桌機端無法參與同步"], ans: _A1, exp: "綠色是橘色的特例：仍是本機資料夾，只是多了同步；AI 不會因此自動讀到。" },
    { q: "學生最常見的第一個誤解是什麼？", opts: ["以為 AI 對先前的每一輪對話都完全沒有記憶", "把「AI 記得我」誤解成「我的檔案在雲端」", "以為付費方案與免費方案在檔案存取權限上沒有差別", "以為在手機上完全無法使用任何一種 AI 工具"], ans: _A1, exp: "AI 記得的是藍色的雲端紀錄，不是你橘色的本機檔案。" },
    { q: "分層思考最直接的好處是什麼？", opts: ["讓模型的回應速度與正確率同時大幅提升", "把模糊的症狀還原成可定位的層級問題", "自動把所有本機檔案同步備份到雲端硬碟", "讓使用者免除購買付費方案的需要"], ans: _A1, exp: "定位對了，解法才會對；否則只會反覆抱怨「它又忘了」。" },
    { q: "「它忘記了」這個症狀，可能同時對應到哪些層級？", opts: ["只可能是第 9 層 context window 被壓縮，與帳號層和任務層都無關", "只可能是第 1 層裝置問題，只要換一台電腦就一定會重新發生", "可能是第 4 層帳號、第 8 層任務或第 9 層 context window", "只可能是第 5 層介面選錯，跟帳號層與任務層都沒有任何關係"], ans: _A2, exp: "同一個症狀可能來自三個不同層級，所以必須先定位再處理。" }

  /* ===== M2 ===== */
  m2_nav: "2. 第 1–2 層：裝置與使用者",
  m2_title: "第 1–2 層：裝置與使用者（本機的地基）",
  m2_overview: "第 1 層是裝置：筆電、桌機、伺服器、平板、手機。它決定「本機檔案和工具到底在哪一台機器上」。第 2 層是使用者：誰登入這台裝置，Windows 或 macOS 的使用者身分會直接影響本機路徑與權限。這兩層合起來就是橘色空間的地基，也是換電腦時最先斷掉的兩層。",
  m2_highlights: ["裝置層", "使用者層", "本機路徑", "作業系統權限", "換機斷點", "橘色地基"],
  m2_p1: "裝置層要回答的問題非常樸素：這件工作需要的檔案與工具，實際上放在哪一台機器？A 電腦有 D:\\Research，手機沒有；伺服器上跑得動的命令列工具，平板上根本裝不了。很多人在手機上打開同一個 AI 平台，看到聊天紀錄都在，就以為整個工作環境都跟過來了；其實跟過來的只有藍色部分，橘色部分還留在那台筆電裡。",
  m2_p2: "使用者層決定路徑長什麼樣子，也決定你有沒有權限。Windows 的個人資料夾是 C:\\Users\\jimmy\\... ，換一個 Windows 使用者登入，同一台機器上的路徑就不一樣；公司或學校配發的電腦還可能有群組原則、防毒軟體或磁碟加密，讓某些資料夾根本無法被外部工具讀寫。這也是為什麼「同一台電腦上明明有這個檔案，AI 卻讀不到」——很多時候不是 AI 的問題，是第 2 層的權限問題。",
  m2_p3: "把這兩層講清楚，你會發現「換電腦會斷什麼」其實可以逐項列出：本機資料夾與其中的檔案會斷、你在本機安裝的工具與相依套件會斷、你授權給桌面版應用程式的資料夾權限會斷、寫死在指令或設定檔裡的絕對路徑會斷。相對的，只要帳號沒變，雲端的聊天紀錄與專案通常不會斷。斷與不斷的分界線，就是藍色與橘色的分界線。",
  m2_p4: "實務上的建議有三點。第一，講述你的工作環境時，永遠把裝置與使用者講出來，例如「我的筆電、Windows 使用者 jimmy」。第二，把重要的工作資料夾放在同步資料夾底下（綠色），讓換機的成本從「重做」降成「重新指定路徑」。第三，避免在提示詞或設定裡寫死絕對路徑，改用專案根目錄相對路徑，換機時只需要改一個地方。",
  m2_wrapup: "第 1、2 層是整張圖裡最物理、也最容易被忽略的兩層。它們不會出現在任何 AI 的介面上，卻決定了你的橘色空間到底在哪裡、能不能被讀到。換一台電腦時，這兩層一定會斷，問題只是你有沒有事先降低斷掉的成本。請養成一個習慣：描述任何本機工作時，先說機器，再說使用者，最後才說路徑；這個順序本身就是一份最小的環境說明書。",
  m2_terms: [

    { front: "使用者層（第 2 層）", back: "誰登入這台裝置。作業系統的使用者身分會影響本機路徑與存取權限。" },
    { front: "本機路徑", back: "例如 C:\\Users\\jimmy\\Documents\\PMCS。換使用者或換機器，路徑就會不同。" },
    { front: "權限問題", back: "檔案存在但工具讀不到，常見原因是作業系統權限、群組原則或加密，而不是 AI 的能力不足。" },
    { front: "換機斷點", back: "換電腦時必然中斷的部分：本機資料夾、已安裝工具、已授權路徑、寫死的絕對路徑。" },

    { q: "為什麼同一台電腦上的檔案，AI 有時候讀不到？", opts: ["因為檔案的體積遠遠超過模型單次能處理的上限", "因為這個模型並不支援中文檔名與路徑的編碼方式", "因為第 2 層使用者身分與權限限制了存取", "因為網路頻寬嚴重不足，導致檔案讀取發生逾時"], ans: _A2, exp: "使用者層的權限、群組原則或加密都可能擋住存取。" },
    { q: "在手機上打開同一個 AI 平台，看到聊天紀錄都在，代表什麼？", opts: ["整個工作環境連同本機資料夾與已安裝工具都跟著帳號過來了", "只有藍色的雲端部分跟過來，橘色的本機檔案仍留在原機器", "筆電上的本機資料夾已經自動同步到這支手機上", "手機已經取得對筆電整個檔案系統的完整存取權"], ans: _A1, exp: "跟著帳號走的是藍色；橘色留在原本那台機器。" },
    { q: "下列何者不屬於「換電腦一定會斷」的一項？", opts: ["本機資料夾與其中存放的所有檔案內容", "本機安裝的工具與其相依套件", "同一帳號下的雲端聊天紀錄與專案", "已授權給桌面版應用程式的資料夾權限"], ans: _A2, exp: "只要帳號不變，雲端紀錄與專案通常不會斷。" },
    { q: "降低換機成本最務實的做法是什麼？", opts: ["在每則提示詞裡都寫死完整的本機絕對路徑與磁碟代號", "把重要工作資料夾放在同步資料夾下，並改用相對路徑", "改用免費方案，以避免帳號與裝置之間的綁定", "改成只在手機上工作，以避開本機路徑問題"], ans: _A1, exp: "綠色同步加上相對路徑，可把「重做」降成「重新指定路徑」。" },
    { q: "描述本機工作環境時，建議的敘述順序是什麼？", opts: ["路徑 → 使用者 → 機器", "機器 → 使用者 → 路徑", "模型 → 介面 → 路徑", "專案 → 帳號 → 機器"], ans: _A1, exp: "先講機器、再講使用者、最後講路徑，這個順序本身就是最小環境說明書。" }

  /* ===== M3 ===== */
  m3_nav: "3. 第 3–4 層：AI 平台與帳號／Workspace",
  m3_title: "第 3–4 層：AI 平台與帳號／Workspace（雲端的地基）",
  m3_overview: "第 3 層是 AI 平台：ChatGPT、Claude、Gemini。不同平台有自己的專案、歷史紀錄、權限規則與產品名稱，平台之間的雲端紀錄通常不互通。第 4 層是同一平台裡的帳號、訂閱方案與 workspace：你的雲端 chats 與 projects 幾乎都是跟這一層走的。這兩層合起來就是藍色空間的地基。",
  m3_highlights: ["平台不互通", "帳號綁定", "Workspace 隔離", "訂閱方案", "產品名稱差異", "藍色地基"],
  m3_p1: "平台層的關鍵認知是「不互通」。你在 Claude 裡建立的專案，ChatGPT 看不到；你在 Gemini 裡的歷史紀錄，Claude 也讀不到。這不是技術上做不到，而是各平台的雲端儲存本來就是各自獨立的產品。更麻煩的是名稱：同一件事在不同平台叫不同名字，Projects、Gems、GPTs、Spaces 各有各的說法，讓初學者以為自己學了三套完全不同的東西，其實只是同一個層級的不同商標。",
  m3_p2: "帳號與 workspace 層則決定了「同一個平台裡，你到底站在哪一個房間」。同一個人可能同時有個人帳號、學校 workspace 與公司 workspace；三個房間的聊天紀錄、專案、檔案與權限是分開的。學生最常見的意外是：用學校帳號建立的專案，回家用個人帳號登入就找不到了，於是以為「資料被刪掉了」，其實只是站錯房間。",
  m3_p3: "訂閱方案也在這一層。方案決定你能用哪些模型、有多少用量、能不能使用桌面版的檔案操作與更長的上下文。本課程要求同學具備付費方案，因為第 5、6 層的許多能力在免費方案上根本不會出現；若組內有同學暫時無法自行訂閱，請在組內互相支援、共同分擔，讓每一組至少能完整跑完一次含檔案操作的工作流程。",
  m3_p4: "實務上的紀律很簡單：先決定房間，再開始工作。每次要做一件比較長期的事情之前，先確認自己在哪個平台、用哪個帳號、在哪個 workspace，然後把這三件事寫在你的專案說明第一行。這一行字在你換裝置、找不到東西、或要交接給組員時，價值會遠遠超過你當下花的十秒鐘。",
  m3_wrapup: "第 3、4 層是藍色空間的地基：平台決定你在哪一個生態系，帳號與 workspace 決定你在這個生態系裡的哪一個房間。它們共同的特性是「跟著登入身分走，不跟著機器走」，所以只要身分一致，換裝置通常不會斷。反過來說，只要身分不一致，就算坐在同一台電腦前，你也會什麼都找不到。請把「平台＋帳號＋workspace」當成一組必須一起講出來的座標。",
  m3_terms: [
    { front: "AI 平台層（第 3 層）", back: "ChatGPT、Claude、Gemini 等。各自有專案、歷史紀錄與權限規則，雲端紀錄通常不互通。" },
    { front: "帳號／Workspace（第 4 層）", back: "同一平台裡你登入的身分與所屬工作區。雲端 chats 與 projects 幾乎都跟這一層走。" },
    { front: "Workspace 隔離", back: "個人、學校、公司 workspace 的紀錄、權限與資料互相分開，切換身分就看不到彼此。" },
    { front: "訂閱方案", back: "決定可用模型、用量與進階能力（如檔案操作、更長上下文）。本課程要求具備付費方案。" },
    { front: "產品名稱差異", back: "Projects、Gems、GPTs 等只是不同平台對同一層級的不同商標，不是不同的概念。" },
    { front: "三元座標", back: "描述雲端工作時必須一起講出來的三件事：平台、帳號、workspace。" }
  ],
  m3_q: [
    { q: "關於第 3 層 AI 平台，下列敘述何者正確？", opts: ["各平台的雲端紀錄通常可以直接互相匯入並延續使用", "各平台的雲端紀錄通常不互通，且產品名稱各異", "平台只決定計費方式，並不會影響任何存取權限規則", "平台之間的差異只在於介面配色與排版"], ans: _A1, exp: "平台之間的雲端儲存是各自獨立的產品，名稱也不同。" },
    { q: "雲端的 chats 與 projects 主要跟著哪一層走？", opts: ["第 1 層裝置與其作業系統環境", "第 2 層使用者身分與檔案權限", "第 4 層帳號／workspace", "第 9 層 context window"], ans: _A2, exp: "藍色雲端紀錄的識別依據就是帳號與 workspace。" },
    { q: "學生「用學校帳號建的專案回家找不到」最可能的原因是什麼？", opts: ["該專案已被平台的資料保留政策在到期之後自動清除掉", "登入了不同的帳號或 workspace，站錯房間", "家中那台電腦的硬碟或檔案系統已經悄悄損壞", "家中網路速度不足，導致專案清單來不及載入"], ans: _A1, exp: "workspace 之間互相隔離，換身分就看不到。" },
    { q: "訂閱方案屬於第幾層的議題？", opts: ["第 1 層裝置本身與其作業系統的版本與相容性", "第 4 層帳號／方案／workspace", "第 7 層工作容器與其中掛載的執行環境設定", "第 8 層任務本身與其目標的涵蓋範圍"], ans: _A1, exp: "方案與帳號同屬第 4 層，決定可用能力與用量。" },
    { q: "本課程對訂閱方案的要求是什麼？", opts: ["一律使用免費方案即可完成所有作業", "要求具備付費方案，組員間可互相支援", "禁止使用任何雲端平台，一律離線作業", "全班只能使用同一個指定的付費平台"], ans: _A1, exp: "第 5、6 層許多能力在免費方案上不會出現，故要求付費方案並鼓勵組內支援。" },
    { q: "描述雲端工作時應一起講出來的三元座標是什麼？", opts: ["機器名稱、完整路徑、檔案名稱", "平台、帳號、workspace", "模型名稱、取樣溫度、輸出長度", "介面種類、執行模式、工作容器層"], ans: _A1, exp: "平台＋帳號＋workspace 才能唯一定位你的藍色空間。" }

  /* ===== M4 ===== */
  m4_nav: "4. 第 5–6 層：工作介面與工作模式",
  m4_title: "第 5–6 層：工作介面與工作模式",
  m4_overview: "第 5 層是工作介面：雲端 Web App、桌面版、行動 App。介面不同，能力不一定相同。第 6 層是工作模式：Chat 用於聊天問答與快速整理，Work 或 Cowork 處理較完整的任務與交付物，Codex 或 Code 則面對檔案、程式碼、命令與 repo。名稱會隨平台而變，但核心差異只有一個：純對話，還是能操作檔案與工具。",
  m4_highlights: ["Web／桌面／行動", "能力不對等", "Chat", "Work／Cowork", "Codex／Code", "能否操作檔案"],
  m4_p1: "介面層的實務規則是：Chat 與雲端型工作比較容易跨 Web、桌面與行動，因為它們只需要帳號；而本機檔案操作通常需要桌面版，加上你在作業系統層級給予的資料夾權限。這就是為什麼很多同學在手機上找不到某個功能——不是帳號有問題，而是那個能力本來就沒有出現在行動介面上。介面決定的是「這個環境能做到什麼」，不是「你的東西在哪裡」。",
  m4_p2: "模式層則是同一個介面裡的不同工作型態。Chat 適合問答、腦力激盪與快速整理，成本低、回合短。Work 或 Cowork 適合較完整的任務：它會有工作狀態、產出物，甚至可以跨多個步驟推進。Codex 或 Code 面對的是檔案系統與命令列：讀寫檔案、跑指令、操作 repo。三者的差別不在模型比較聰明，而在它被授予了什麼樣的手腳。",
  m4_p3: "把第 5 層與第 6 層交叉起來看，會得到一張很實用的能力表。同一個模式在不同介面上未必等價：例如檔案操作模式在桌面版可以直接讀寫你授權的資料夾，在 Web 上通常只能處理你上傳的檔案，在行動版可能根本沒有。因此規劃工作時，正確的問法不是「這個平台能不能做」，而是「這個平台的這個介面、在這個模式下，能不能做」。",
  m4_p4: "選擇的原則可以很簡單：如果產出只是一段文字或一個想法，用 Chat；如果產出是一份需要多步驟推進、有明確交付物的任務，用 Work 或 Cowork；如果產出要落到檔案、程式碼或版本控制，用 Code 類模式並在桌面版操作。先想清楚產出物長什麼樣子，模式就自動決定了；反過來先選模式再想產出，通常會卡住。",
  m4_wrapup: "第 5、6 層決定的是能力，不是位置。它們常被誤當成「我的東西在哪裡」的答案，其實那是第 7 層的工作容器要回答的。介面與模式的核心判準只有一句話：這個組合能不能操作檔案與工具？能，你就進入了橘色與綠色的世界；不能，你的一切都只會落在藍色的雲端紀錄裡。先確認能力，再決定容器，工作流程才不會走到一半發現做不下去。",
  m4_terms: [
    { front: "工作介面（第 5 層）", back: "雲端 Web App、桌面版、行動 App。介面不同，可用能力不一定相同。" },
    { front: "Chat 模式", back: "聊天、問答、快速整理。回合短、成本低，產出主要是文字與想法。" },
    { front: "Work／Cowork 模式", back: "處理較完整的任務與交付物，具備工作狀態，可跨多步驟推進。" },
    { front: "Codex／Code 模式", back: "面對檔案、程式碼、命令與 repo 的模式，通常需要桌面版與本機權限。" },
    { front: "能力不對等", back: "同一模式在 Web、桌面、行動上未必等價；正確問法是「這個介面在這個模式下能不能做」。" },
    { front: "核心分野", back: "所有模式的根本差異只有一個：純對話，還是能操作檔案與工具。" }
  ],
  m4_q: [
    { q: "第 5 層與第 6 層共同決定的是什麼？", opts: ["你的工作內容實際被存放在哪一層", "這個環境能做到什麼（能力）", "你每個月需要支付的訂閱費用金額", "模型在單輪中可使用的上下文長度"], ans: _A1, exp: "介面與模式決定能力；位置是第 7 層工作容器的問題。" },
    { q: "本機檔案操作通常需要什麼條件？", opts: ["只要登入到同一個付費帳號就可以", "桌面版介面加上本機資料夾權限", "只需要安裝行動版 App 即可", "只需要更大的 context 上限"], ans: _A1, exp: "檔案操作要求桌面版與作業系統層級的授權。" },
    { q: "Chat 與 Work／Cowork 的主要差別是什麼？", opts: ["Chat 與 Work 背後掛載的基礎模型完全不同，能力因此有別", "Work／Cowork 面向較完整的任務與交付物，具工作狀態", "Chat 的每次呼叫計費明顯比 Work／Cowork 昂貴", "Work／Cowork 只支援中文介面，Chat 才支援多語切換"], ans: _A1, exp: "差別在任務完整度與工作狀態，不在模型聰明程度。" },
    { q: "所有工作模式的核心分野是什麼？", opts: ["模型在回應速度上的快慢與穩定度", "純對話，還是能操作檔案與工具", "介面配色與版面的樣式差異", "是否支援語音輸入與語音朗讀功能"], ans: _A1, exp: "這是判斷模式的唯一根本判準。" },
    { q: "規劃工作時，正確的提問方式是什麼？", opts: ["這個平台整體上究竟能不能做得到這件事", "這個平台的這個介面、在這個模式下能不能做", "這個模型的推理能力究竟夠不夠聰明", "這個帳號是不是已升級到更高等級的付費方案"], ans: _A1, exp: "介面與模式必須一起問，因為能力不對等。" },
    { q: "產出要落到檔案、程式碼與版本控制時，最適合的選擇是什麼？", opts: ["手機上的行動版 Chat", "桌面版的 Code 類模式", "瀏覽器上的 Web 版 Chat", "任何介面搭配任何模式都可以勝任"], ans: _A1, exp: "檔案與 repo 操作需要桌面版與具檔案能力的模式。" }
  ],

  /* ===== M5 ===== */
  m5_nav: "5. 第 7 層：工作容器",
  m5_title: "第 7 層：工作容器——你的工作到底放在哪裡？",
  m5_overview: "第 7 層是整張圖的樞紐，因為它直接回答那個最常被問的問題：你的工作到底放在哪裡？圖上並列四種容器：一般對話（藍）、一般專案（藍）、本機資料夾（橘）、雲端硬碟（綠）。雲端型的容器只要同帳號、同 workspace 就比較容易跨裝置延續；本機型的容器則要求另一台裝置也有那個資料夾，並且重新指定路徑。",
  m5_highlights: ["一般對話", "一般專案", "本機資料夾", "雲端硬碟", "跨裝置延續性", "容器選擇"],
  m5_p1: "一般對話（藍）是最輕的容器：AI 雲端聊天紀錄，跟帳號與 workspace 走。它適合一次性的問答與探索，缺點是內容散落在時間軸上，沒有明確的檔案結構，找回舊內容只能靠搜尋與記憶。很多人把整個學期的工作都堆在一長串對話裡，於是永遠處在「我記得我問過，但找不到」的狀態。",
  m5_p2: "一般專案（藍）是雲端上的專案空間，可以集中 chats、上傳檔案與自訂指示。它比一般對話多了結構與延續性：同一個專案裡的多段對話共享同一組脈絡與指示，換裝置只要登入同帳號同 workspace 就看得到。代價是它仍然在平台的雲端裡，不等於你電腦上的檔案，也不會自動變成可版本控制的 repo。",
  m5_p3: "本機資料夾（橘）是真正的檔案世界，例如 D:\\Project。它的優點是可以放任何格式、可以被其他軟體使用、可以進版本控制；缺點是綁在那一台機器上，換裝置要重新準備資料夾並重新指定路徑。雲端硬碟（綠）介於兩者之間：仍然是本機資料夾，但透過 OneDrive 等服務同步到其他裝置，讓跨裝置延續變得可行，代價是路徑不同、同步有延遲，偶爾還會產生衝突副本。",
  m5_p4: "選容器的原則是看你要保護什麼。要保護「思路與脈絡」，用專案；要保護「檔案與版本」，用本機資料夾配版本控制；要在兩台以上的機器之間搬動檔案，用雲端硬碟；只是想快速問一件事，就用一般對話，不要為它建專案。真正成熟的做法是混用：專案負責脈絡與指示，本機資料夾負責檔案與版本，兩者透過明確的路徑約定接起來。",
  m5_wrapup: "第 7 層是雲端與本機真正交會的地方，也是整套分層最值得投資理解的一層。四種容器沒有優劣，只有適配：藍色容器換裝置容易延續但不是檔案，橘色容器是真檔案但綁機器，綠色容器用同步換取延續性但要付出路徑與衝突的代價。請養成在每一份工作開始前問一句：這件事的成果要留在哪一種容器？答案寫下來，你後面的所有麻煩會少一半。",
  m5_terms: [
    { front: "一般對話（藍）", back: "AI 雲端聊天紀錄，跟帳號與 workspace 走。輕量、適合一次性問答，但缺乏結構。" },
    { front: "一般專案（藍）", back: "雲端專案空間，集中 chats、檔案與自訂指示，提供共享脈絡與較好的延續性。" },
    { front: "本機資料夾（橘）", back: "某一台電腦上的資料夾，例如 D:\\Project。可放任何格式、可版本控制，但綁機器。" },
    { front: "雲端硬碟（綠）", back: "同步資料夾（OneDrive 等），本機資料夾加跨裝置同步；路徑仍隨機器不同。" },
    { front: "跨裝置延續性", back: "雲端型只要同帳號同 workspace 即較易延續；本機型需另一台裝置也有資料夾並重新指定路徑。" },
    { front: "混用策略", back: "專案負責脈絡與指示，本機資料夾負責檔案與版本，透過明確路徑約定接起來。" }
  ],
  m5_q: [
    { q: "第 7 層工作容器要回答的核心問題是什麼？", opts: ["這個模型本身究竟有多聰明", "你的工作到底放在哪裡", "訂閱一個月究竟要花多少錢", "單輪的上下文究竟有多長"], ans: _A1, exp: "工作容器就是「工作放在哪裡」的那一層。" },
    { q: "下列哪一組容器屬於藍色的 AI 雲端空間？", opts: ["本機資料夾與雲端硬碟", "一般對話與一般專案", "一般專案與本機資料夾", "雲端硬碟與一般對話"], ans: _A1, exp: "一般對話與一般專案都跟帳號／workspace 走，屬藍色。" },

    { q: "本機資料夾的主要代價是什麼？", opts: ["它本身無法存放超過一定體積上限的大型二進位格式檔案", "綁在那一台機器上，換裝置需重新準備並重新指定路徑", "本身無法對其中的檔案做任何形式的版本控制與歷史還原", "只能存放純文字檔案，完全不能存放二進位格式的檔案"], ans: _A1, exp: "橘色容器的識別依據是機器與路徑，所以換機就會斷。" },

  /* ===== M6 ===== */
  m6_nav: "6. 第 8–9 層：任務與 Context Window",
  m6_title: "第 8–9 層：任務與 Context Window",
  m6_overview: "第 8 層是任務（Task／Chat／Thread）：一個持久的工作單元，不只是單次模型呼叫。它會記住對話紀錄、工作狀態、權限，以及可能綁定的工作資料夾。第 9 層是 context window：模型當下能直接看見的上下文範圍。最常見的誤解就發生在這裡——把 context window 當成儲存空間。",
  m6_highlights: ["任務是持久單元", "工作狀態", "綁定資料夾", "Context Window", "壓縮與摘要", "壓縮 ≠ 換資料夾"],
  m6_p1: "任務層的重點是「持久」。一個任務不是一次問答，而是一條會累積狀態的工作線：它記得你們談過什麼、目前做到哪一步、被授予了哪些權限。如果這個任務是在本機專案裡開的，它還會綁定那台電腦上的某一個工作資料夾，例如 C:\\Users\\jimmy\\OneDrive\\文件\\[TA group meeting]。這個綁定非常重要，因為它就是藍色任務與橘色檔案之間真正的那一條線。",
  m6_p2: "Context window 則完全不同。它是模型在這一次生成時能直接看見的內容範圍，像是工作桌面而不是檔案櫃。它不是資料夾，不是專案，也不是帳號的儲存空間。當對話長到超過上限，系統會壓縮或摘要較早的內容，讓最重要的部分留在視野內。這時模型可能忘記某些細節，但那不代表你的任務結束，更不代表你的工作資料夾換了。",
  m6_p3: "把兩層分開，就能解釋很多看似矛盾的現象。模型突然記不得三十輪前的一個數字，是第 9 層的壓縮；但它仍然能讀寫你授權的資料夾、仍然知道這個任務要交付什麼，那是第 8 層還在。反過來，如果你開了一個全新的任務，就算 context window 很長，它也不會自動繼承上一個任務的資料夾綁定與工作狀態——那是第 8 層真的換了。",
  m6_p4: "實務上的因應方式有三個。第一，重要的結論不要只留在對話裡，寫進專案指示或檔案，讓它跨越壓縮。第二，把長任務切成明確的階段，每個階段結束時做一次書面收斂。第三，當你懷疑模型「忘了」，先判斷這是壓縮還是換任務：如果只是壓縮，補一段摘要即可；如果是換任務，你要重新給脈絡並重新確認資料夾綁定。",
  m6_wrapup: "第 8 層與第 9 層的分界，是整套分層裡最容易搞混、也最值得反覆練習的一組。請記住兩個判準：任務是持久的工作單元，會記住狀態、權限與資料夾綁定；context window 只是模型當下的視野，會被壓縮但不會改變你的容器。壓縮之後通常仍是同一個任務，不等於換工作資料夾。能穩定地區分這兩件事，你對 AI 的期待就會從迷信變成可預測的工程判斷。",
  m6_terms: [
    { front: "任務（第 8 層）", back: "Task／Chat／Thread：持久的工作單元，記住對話紀錄、工作狀態、權限與可能的工作資料夾。" },

    { front: "Context Window（第 9 層）", back: "模型當下能直接看見的上下文範圍。它不是資料夾、不是專案，也不是帳號儲存空間。" },
    { front: "壓縮／摘要", back: "對話過長時，系統會壓縮或摘要較早內容以保留最重要的部分留在視野內。" },
    { front: "壓縮 ≠ 換資料夾", back: "壓縮後通常仍是同一個任務，工作資料夾與權限並未改變。" },

  ],
  m6_q: [
    { q: "第 8 層的任務（Task／Chat／Thread）最重要的性質是什麼？", opts: ["它等於單獨一次模型呼叫，只要呼叫結束所有狀態就完全消失", "它是持久的工作單元，會記住狀態、權限與可能的資料夾綁定", "它只存在於行動版 App，桌面端沒有這個概念", "它等於 context window，只是換個名字"], ans: _A1, exp: "任務是持久單元，不是單次呼叫。" },
    { q: "Context window 是什麼？", opts: ["這個帳號在雲端可用的儲存空間配額", "平台上專屬於這個帳號的雲端資料夾", "模型當下能直接看見的上下文範圍", "本機硬碟上某一個專案的根目錄"], ans: _A2, exp: "它像工作桌面，不是檔案櫃。" },
    { q: "對話太長觸發壓縮或摘要後，通常會發生什麼？", opts: ["這個任務會直接被結束掉，而且原本綁定的工作資料夾也跟著換掉", "仍是同一個任務，工作資料夾不變，但部分細節可能不在視野內", "帳號會被平台自動登出，之後必須重新登入才能繼續存取這個任務", "專案連同其中的所有檔案，都會被平台自動刪除而且完全無法再復原"], ans: _A1, exp: "壓縮只影響第 9 層視野，不改變第 8 層任務與容器。" },
    { q: "開一個全新的任務時，會發生什麼？", opts: ["自動繼承上一個任務的資料夾綁定與工作狀態", "不會自動繼承資料夾綁定與工作狀態", "自動延長 context window", "自動切換到另一個帳號或 workspace"], ans: _A1, exp: "第 8 層真的換了，就必須重新給脈絡與重新確認綁定。" },

    { q: "要讓重要結論跨越壓縮存活，最有效的做法是什麼？", opts: ["在對話裡一直重複貼上同一段重要的結論文字", "寫進專案指示或檔案，而不是只留在對話裡", "換用一個 context 長度更大的模型", "把這一段對話整個關掉之後再重新開啟一次試試"], ans: _A1, exp: "寫進容器（專案或檔案）才會跨越第 9 層的壓縮。" }

  /* ===== M7 ===== */
  m7_nav: "7. 跨裝置斷點診斷與三句總結",
  m7_title: "跨裝置斷點診斷與三句總結",
  m7_overview: "把九層學完之後，最實用的產出是一套診斷法：換一台電腦時，逐層問「這一層跟著我走嗎？」答案會很乾脆——第 1 層裝置、第 2 層使用者、第 7 層的本機型容器、以及第 8 層在綁定路徑時，這幾處會斷；其餘跟著帳號走的層級通常不會斷。最後我們把整張圖收束到三句可以帶走的結論，並接到 PMCS 期末專案的實際規劃。",
  m7_highlights: ["逐層診斷", "四個斷點", "三句總結", "期末專案", "Repo 定位", "知識庫與記憶"],
  m7_p1: "診斷的流程是機械式的，正因為機械所以可靠。第 1 層：新機器上有沒有我需要的檔案與工具？沒有，斷。第 2 層：我在新機器上的使用者是誰、路徑長什麼樣、有沒有權限？不同，斷。第 3 層與第 4 層：平台、帳號、workspace 是否相同？相同，不斷。第 5 層與第 6 層：新機器上是否安裝了桌面版、是否能進入需要的模式？沒裝，能力斷。第 7 層：容器是藍色還是橘色？藍色不斷，橘色與綠色要重新準備並重新指定路徑。第 8 層：任務有沒有綁定舊路徑？有，需要重新綁定。第 9 層：context window 本來就是每次重建，不存在「跟不跟著走」的問題。",
  m7_p2: "把這套診斷跑過一次，你會發現「換電腦很麻煩」其實可以拆成四個具體工作：把本機資料夾準備好、把工具與桌面版裝好、把路徑重新指定、把任務重新綁定。這四件事都可以事先降低成本：資料夾放同步（綠色）、工具寫成一份安裝清單、路徑改成相對路徑或設定檔、任務的關鍵脈絡寫進專案指示。麻煩不會消失，但會從不可預期變成可排程。",
  m7_p3: "三句總結是整張圖的壓縮版。第一句：帳號與 workspace 管雲端紀錄，裝置管本機檔案。第二句：專案與工作資料夾把雲端工作和本機檔案接起來。第三句：context window 只是模型當下的視野。這三句涵蓋了藍、橘、綠三種空間、九個層級，以及最常見的那個誤解。如果你只能記住一頁，就記這三句。",
  m7_p4: "最後接到 PMCS 期末專案。你的 repo 屬於第 7 層的本機型容器，並且通常搭配版本控制與遠端主機，所以它天然需要第 1、2 層的準備；你的知識庫如果是 Markdown 檔案，同樣落在第 7 層橘色或綠色，若是放在平台專案裡則是藍色；你的記憶機制（自訂指示、專案說明、長期偏好）屬於第 4 層與第 7 層藍色的一部分，跟著帳號走。請在期末專案的環境說明裡，明確寫出每一項屬於第幾層、放在哪一種顏色的空間，這份說明本身就是你環境素養的證據。",
  m7_wrapup: "分層不是為了學會九個名詞，而是為了在出問題時能在三十秒內定位。請把診斷法背成一串固定問句：機器？使用者？平台？帳號與 workspace？介面？模式？容器？任務綁定？視野？順著問下去，答案自己會浮現。然後用三句總結檢查自己的規劃：雲端紀錄有沒有跟著帳號、檔案有沒有跟著裝置、接口有沒有靠專案與工作資料夾接起來、有沒有把 context window 誤當成儲存空間。這四個檢查點，就是你帶得走的 AI 環境素養。",
  m7_terms: [

    { front: "四個斷點", back: "第 1 層裝置、第 2 層使用者、第 7 層本機型容器、第 8 層綁定路徑時，最容易在換機時中斷。" },
    { front: "第一句總結", back: "帳號與 workspace 管雲端紀錄；裝置管本機檔案。" },

    { q: "在 PMCS 期末專案中，Markdown 知識庫若放在同步資料夾下，屬於哪一種空間？", opts: ["藍色 AI 雲端空間（跟帳號走）", "綠色雲端硬碟同步（本質仍是本機）", "第 9 層 context window", "它不屬於上述任何一種空間的分類"], ans: _A1, exp: "同步資料夾是綠色，本質仍是本機檔案。" },

  /* ===== M0 ===== */
  m0_nav: "0. Executive Summary",
  m0_title: "The Layered Model of an AI Work Environment",
  m0_intro: "Plenty of people have used AI daily for six months and still cannot answer one basic question: the work I just did — where does it actually live? In the cloud history of some account? In a folder on some particular computer? Or only inside the slice of context the model happens to be able to see right now? Those three answers have completely different consequences. Switch computer, switch account, switch interface, and some things survive while others simply vanish. This material takes an AI work environment apart into nine layers: device, user, AI platform, AI account and workspace, work interface, work mode, work container, task, and context window. Every layer is interrogated with the same question: what is this layer bound to, and does it travel with me when I move? Running alongside the nine layers are three colours of space. Blue is AI cloud space, which follows your account and workspace. Orange is local space, which follows one machine and one path. Green is cloud-drive sync — a local folder plus cross-device synchronisation. Once you can do this layering, you stop mistaking \"the AI remembers me\" for \"my files are in the cloud\", and you stop treating the context window as storage. This is the first required reading of PMCS Week 3, and the foundation for how you will later place your term-project repository, knowledge base and memory.",
  m0_why: "Why is layered thinking the foundation of AI literacy?",
  m0_why_desc: "People who do not layer can only describe symptoms: \"it forgot\", \"the file is gone\", \"it will not open on my phone\". People who layer can locate the fault: is this a layer 4 account problem, a layer 7 container problem, or a layer 9 context-window problem? Locate correctly and the fix follows. Layering is also a shared language for teamwork — when you can say \"my project lives in the Claude teaching workspace, my working folder is on the D drive of my laptop\", your teammates finally know how to pick the work up.",

  /* ===== M1 ===== */
  m1_nav: "1. Why Layer at All: Three Kinds of Space",
  m1_title: "Why Layer at All: Three Kinds of Space",
  m1_overview: "Before taking the nine layers apart, learn the three-colour legend that runs through the whole diagram. Blue is AI cloud space, which follows your account and workspace. Orange is local space, which follows one machine and one path. Green is cloud-drive sync, which is really a local folder plus cross-device synchronisation. Almost every complaint of the form \"my stuff disappeared\" reduces to one sentence: you thought it was blue, and it was actually orange.",
  m1_highlights: ["Three Spaces", "Blue: AI Cloud", "Orange: Local", "Green: Cloud-Drive Sync", "Account ≠ Files", "Layered Diagnosis"],
  m1_p1: "Blue AI cloud space is what the platform keeps for you: chat history, project spaces, reference files uploaded into a project, custom instructions. Its identifier is which account you signed in with and which workspace you are standing in. As long as account and workspace stay the same, you can change phone, laptop or browser and generally still see it. This is exactly why people develop the intuition that \"the AI remembers me\" — what it remembers is cloud records, not your hard drive.",
  m1_p2: "Orange local space is the folders and files on your own machine, such as D:\\Research or C:\\Users\\jimmy\\Documents\\PMCS. Its identifier is a machine plus a path. For an AI to read it, three conditions must hold at once: you are using an interface and mode that can touch files, that machine is in front of you, and you have granted access to that path. Change computer and the orange material does not follow you on its own.",
  m1_p3: "Green cloud-drive sync is a special case of orange: it is still a local folder, but a sync service such as OneDrive, Google Drive or iCloud mirrors the same content onto your other devices. The benefit is that continuity across devices becomes possible; the price is that the path looks different on each machine, and sync brings delay and occasional conflict copies. Green is not blue: the AI platform still cannot see it, and you still have to point at the path again on the new machine.",
  m1_p4: "The value of layering is that it turns a vague complaint into a diagnosable problem. \"It forgot\" can be three entirely different things: you may have switched account (layer 4), you may have opened a new task (layer 8), or this conversation may simply have run long enough to be compacted (layer 9). The remedies have nothing in common. Learn to ask \"which layer is this?\" first, and you can find the right fix in thirty seconds instead of uselessly telling the model off for forgetting again.",
  m1_wrapup: "The three colours are the shared language of this material, and every later layer will be tagged blue, orange or green. Remember the simplest test: ask whether this thing is identified by an account or by a machine path. If the answer is account, it is blue. If the answer is a path, it is orange. If the answer is a path that also syncs automatically, it is green. Once you can colour every piece of work you hold, you have already taken the first step in AI environment literacy; the remaining eight layers just apply that same test more finely.",
  m1_terms: [
    { front: "AI Cloud Space (Blue)", back: "Space kept by the AI platform and tied to account and workspace: chat history, projects, project files and custom instructions." },
    { front: "Local Space (Orange)", back: "Folders and files at one path on one machine, e.g. D:\\Research. It does not follow you when you change computer." },
    { front: "Cloud-Drive Sync (Green)", back: "A local folder plus a sync service such as OneDrive or Google Drive. Continuity is possible, but the path still varies by machine." },
    { front: "The Identifier Test", back: "The key question for classifying space: is this thing found by account, or found by machine and path?" },
    { front: "Layered Diagnosis", back: "The method of reducing a symptom such as \"it forgot\" to a specific layer, so the fix has a definite target." },
    { front: "The First Misconception", back: "Mistaking \"the AI remembers me\" (blue cloud records) for \"my files are in the cloud\" (actually orange local files)." }
  ],
  m1_q: [
    { q: "In the three-colour legend of this material, what does blue represent?", opts: ["AI cloud space, following account and workspace", "Local folders and files tied to one specific machine and one path", "A local folder spread out by a sync service like OneDrive", "What the model can actually see in this conversation turn"], ans: _A0, exp: "Blue = AI cloud space, identified by account and workspace." },
    { q: "What identifies orange local space?", opts: ["Your paid subscription tier", "A machine plus a path", "The browser brand and version", "How long this chat has run"], ans: _A1, exp: "Orange is found by machine plus path, which is why changing machine breaks it." },
    { q: "Which statement about green cloud-drive sync is correct?", opts: ["It equals AI cloud space, so signing into the same account reveals the whole folder automatically", "It is a local folder plus cross-device sync, and you still repoint the path on a new machine", "It needs no local folder at all, since all of the content lives only in the sync provider cloud", "It runs only on mobile devices, and desktop machines are unable to join the sync at all"], ans: _A1, exp: "Green is a special case of orange: still a local folder, just synchronised; the AI does not gain access automatically." },
    { q: "What is the most common first misconception among students?", opts: ["Believing that the AI retains no memory at all of any earlier chat turn", "Mistaking \"the AI remembers me\" for \"my files are in the cloud\"", "Believing that paid and free plans differ in no way on file-access rights", "Believing that phones simply cannot run any kind of AI tool whatsoever"], ans: _A1, exp: "What the AI remembers is blue cloud records, not your orange local files." },
    { q: "What is the most immediate benefit of layered thinking?", opts: ["It makes model responses far faster and more accurate", "It turns a vague symptom into a locatable layer problem", "It backs up every local file to a cloud drive automatically", "It removes any need to buy a paid subscription"], ans: _A1, exp: "Locate correctly and the fix follows; otherwise you just keep complaining that it forgot again." },
    { q: "The symptom \"it forgot\" may correspond to which layers?", opts: ["Only layer 9 context window compression, unrelated to account or task", "Only layer 1 device, and it recurs whenever you switch computers", "Layer 4 account, layer 8 task, or layer 9 context window", "Only layer 5 interface, with no bearing on account or task layers"], ans: _A2, exp: "One symptom, three possible layers — which is why you locate before you act." }
  ],

  /* ===== M2 ===== */
  m2_nav: "2. Layers 1–2: Device and User",
  m2_title: "Layers 1–2: Device and User (the local foundation)",
  m2_overview: "Layer 1 is the device: laptop, desktop, server, tablet, phone. It decides which machine your local files and tools actually sit on. Layer 2 is the user: who is logged into that device, since the Windows or macOS user identity directly shapes local paths and permissions. Together these two layers are the foundation of orange space, and they are the first two layers to break when you change computer.",
  m2_highlights: ["Device Layer", "User Layer", "Local Paths", "OS Permissions", "Machine-Change Breakpoints", "Orange Foundation"],
  m2_p1: "The device layer answers a very plain question: which machine actually holds the files and tools this work needs? Computer A has D:\\Research; the phone does not. A command-line tool that runs on a server cannot even be installed on a tablet. Many people open the same AI platform on their phone, see all their chat history intact, and conclude that the whole work environment came with them. Only the blue part came; the orange part is still sitting in that laptop.",
  m2_p2: "The user layer decides what paths look like and whether you have permission at all. A Windows home folder is C:\\Users\\jimmy\\... , so signing in as a different Windows user gives different paths on the same machine. Institutional laptops may add group policy, security software or disk encryption that makes certain folders unreadable to external tools. This is why \"the file is right there on this computer but the AI cannot read it\" is so often not an AI problem at all, but a layer 2 permission problem.",
  m2_p3: "Once these two layers are explicit, \"what breaks when I change computer\" becomes a list you can actually write down: local folders and the files inside them break, locally installed tools and dependencies break, folder permissions you granted to a desktop application break, and absolute paths hard-coded into prompts or configuration break. By contrast, as long as the account is unchanged, cloud chat history and projects generally do not break. The line between breaking and surviving is exactly the line between orange and blue.",
  m2_p4: "Three practical recommendations follow. First, whenever you describe your work environment, always name the device and the user, for example \"my laptop, Windows user jimmy\". Second, keep important working folders under a sync folder (green) so the cost of changing machine falls from \"redo everything\" to \"repoint the path\". Third, avoid hard-coding absolute paths in prompts or settings; describe files relative to a project root so that a machine change touches exactly one place.",
  m2_wrapup: "Layers 1 and 2 are the most physical and the most frequently ignored layers in the whole diagram. They never appear in any AI interface, yet they determine where your orange space actually is and whether it can be reached at all. When you change computer these two layers will break; the only question is whether you lowered the cost in advance. Build one habit: when describing any local work, say the machine first, the user second, the path last. That order is itself a minimum viable environment specification.",
  m2_terms: [
    { front: "Device Layer (Layer 1)", back: "Laptop, desktop, server, tablet, phone. Decides which machine actually holds local files and tools." },
    { front: "User Layer (Layer 2)", back: "Who is signed in to the device. The OS user identity shapes local paths and access rights." },
    { front: "Local Path", back: "For example C:\\Users\\jimmy\\Documents\\PMCS. Change user or machine and the path changes with it." },
    { front: "Permission Problem", back: "The file exists but the tool cannot read it — usually OS permissions, group policy or encryption, not a limit of the AI." },
    { front: "Machine-Change Breakpoints", back: "What necessarily breaks on a new computer: local folders, installed tools, granted permissions, hard-coded absolute paths." },
    { front: "Relative-Path Habit", back: "Describing files relative to a project root so a machine change requires editing one setting, not rewriting everything." }
  ],
  m2_q: [
    { q: "What does layer 1, the device layer, primarily determine?", opts: ["Your current subscription tier and monthly quota", "Which machine actually holds local files and tools", "The context length the model can carry per turn", "The brand and version of the AI platform you are using"], ans: _A1, exp: "The device layer answers \"on which machine\"." },
    { q: "Why can an AI sometimes not read a file that sits on the same computer?", opts: ["Because the file size exceeds what the model can process at once", "Because the model cannot handle Chinese filenames and path encoding", "Because layer 2 user identity and permissions restrict access", "Because network bandwidth is too low and the read times out"], ans: _A2, exp: "User-layer permissions, group policy or encryption can all block access." },
    { q: "You open the same AI platform on your phone and all chat history is there. What does that mean?", opts: ["The whole work environment, including local folders and tools, moved with the account", "Only the blue cloud part travelled; orange local files stayed on the original machine", "Your local laptop folders have already synchronised themselves to this phone", "The phone has now been granted full access to the laptop file system"], ans: _A1, exp: "What follows the account is blue; orange stays on the original machine." },
    { q: "Which of the following is NOT something that necessarily breaks when you change computer?", opts: ["Local folders and all of the files that are stored inside them", "Locally installed tools and every one of their dependencies", "Cloud chat history and projects under the same account", "Folder permissions already granted to a desktop application"], ans: _A2, exp: "As long as the account is unchanged, cloud records and projects generally survive." },
    { q: "What is the most practical way to lower the cost of changing machine?", opts: ["Hard-code even more complete local absolute paths into every prompt you write", "Keep key working folders under a sync folder and switch to relative paths", "Downgrade to a free plan to avoid account and device binding", "Work only on a phone so that local path issues stop mattering"], ans: _A1, exp: "Green sync plus relative paths turns \"redo everything\" into \"repoint the path\"." },
    { q: "What order is recommended when describing a local work environment?", opts: ["Path → user → machine", "Machine → user → path", "Model → interface → path", "Project → account → machine"], ans: _A1, exp: "Machine, then user, then path — that order is itself a minimum environment specification." }
  ],

  /* ===== M3 ===== */
  m3_nav: "3. Layers 3–4: AI Platform and Account/Workspace",
  m3_title: "Layers 3–4: AI Platform and Account/Workspace (the cloud foundation)",
  m3_overview: "Layer 3 is the AI platform: ChatGPT, Claude, Gemini. Each has its own projects, history, permission rules and product names, and cloud records generally do not travel between platforms. Layer 4 is the account, subscription plan and workspace inside one platform: your cloud chats and projects almost always follow this layer. Together they form the foundation of blue space.",
  m3_highlights: ["No Interoperability", "Account Binding", "Workspace Isolation", "Subscription Plan", "Naming Differences", "Blue Foundation"],
  m3_p1: "The key insight at the platform layer is non-interoperability. A project you built in Claude is invisible to ChatGPT; history you accumulated in Gemini cannot be read by Claude. This is not a technical impossibility but a product reality: each platform's cloud storage is a separate product. Naming makes it worse. The same idea carries a different brand on each platform — Projects, Gems, GPTs, Spaces — which leaves beginners thinking they have learned three unrelated systems when they have really met one layer under three trademarks.",
  m3_p2: "The account and workspace layer decides which room you are standing in inside one platform. The same person may hold a personal account, a university workspace and a company workspace at once, and those three rooms keep separate chats, projects, files and permissions. The most common student surprise is this: a project created under the university account cannot be found at home under the personal account, so they conclude the data was deleted. Nothing was deleted; they are simply standing in the wrong room.",
  m3_p3: "Subscription plans also live at this layer. The plan decides which models you can reach, how much usage you get, and whether you can use desktop file operations and longer context. This course requires students to hold a paid plan, because many of the capabilities discussed in layers 5 and 6 simply do not appear on free tiers. If a group member cannot subscribe on their own for the time being, please support each other within the group and share the cost, so that every group can run at least one complete workflow that includes file operations.",
  m3_p4: "The discipline in practice is simple: choose the room before you start working. Before beginning anything long-lived, confirm which platform, which account and which workspace you are in, then write those three facts on the first line of your project description. That single line will be worth far more than the ten seconds it costs you, the moment you change device, cannot find something, or need to hand the work to a teammate.",
  m3_wrapup: "Layers 3 and 4 are the foundation of blue space: the platform decides which ecosystem you are in, and the account and workspace decide which room within that ecosystem. Their shared property is that they follow your sign-in identity, not your machine, so as long as identity is consistent, changing device usually breaks nothing. The converse also holds: if identity is inconsistent, you can sit at the very same computer and find nothing at all. Treat platform, account and workspace as one set of coordinates that must always be quoted together.",
  m3_terms: [
    { front: "AI Platform Layer (Layer 3)", back: "ChatGPT, Claude, Gemini and others. Each has its own projects, history and permission rules; cloud records rarely interoperate." },
    { front: "Account / Workspace (Layer 4)", back: "The identity you sign in with and the workspace you belong to. Cloud chats and projects almost always follow this layer." },
    { front: "Workspace Isolation", back: "Personal, university and company workspaces keep separate records, permissions and data; switch identity and they disappear from view." },
    { front: "Subscription Plan", back: "Determines available models, usage and advanced capability such as file operations and longer context. This course requires a paid plan." },
    { front: "Naming Differences", back: "Projects, Gems and GPTs are different trademarks for the same layer, not different concepts." },
    { front: "The Three Coordinates", back: "The three things that must always be stated together when describing cloud work: platform, account, workspace." }
  ],
  m3_q: [
    { q: "Which statement about layer 3, the AI platform, is correct?", opts: ["Cloud records can generally be imported straight from one platform to another", "Cloud records generally do not interoperate, and product names differ", "The platform decides billing only and does not affect access permission rules", "Platforms differ from one another only in interface colour"], ans: _A1, exp: "Each platform's cloud storage is a separate product with its own naming." },
    { q: "Cloud chats and projects primarily follow which layer?", opts: ["Layer 1, device and operating system", "Layer 2, user identity and rights", "Layer 4, account and workspace", "Layer 9, the context window"], ans: _A2, exp: "Blue cloud records are identified by account and workspace." },
    { q: "What most likely explains \"the project I made with my university account is missing at home\"?", opts: ["The project was purged automatically by the platform retention policy", "A different account or workspace was signed in — the wrong room", "The hard drive in that home computer had already failed silently", "The home network was too slow for the project list to load in time"], ans: _A1, exp: "Workspaces are isolated from one another; change identity and the content is out of view." },
    { q: "The subscription plan is an issue belonging to which layer?", opts: ["Layer 1, device and operating system version", "Layer 4, account / plan / workspace", "Layer 7, work container and its runtime", "Layer 8, the task and its own scope"], ans: _A1, exp: "Plan and account sit together in layer 4 and gate capability and usage." },
    { q: "What does this course require regarding subscription plans?", opts: ["A free plan is enough to complete all of the assignments in this course", "A paid plan is required, and group members may support one another", "No cloud platform may be used, so all of the work must be done offline", "The entire class must work on one single designated paid platform"], ans: _A1, exp: "Many layer 5 and 6 capabilities do not exist on free tiers, so a paid plan is required and mutual support within groups is encouraged." },
    { q: "What are the three coordinates that must be quoted together for cloud work?", opts: ["Machine name, full path, file name", "Platform, account, workspace", "Model name, temperature, output length", "Interface, run mode, container layer"], ans: _A1, exp: "Only platform plus account plus workspace uniquely locates your blue space." }
  ],

  /* ===== M4 ===== */
  m4_nav: "4. Layers 5–6: Work Interface and Work Mode",
  m4_title: "Layers 5–6: Work Interface and Work Mode",
  m4_overview: "Layer 5 is the work interface: cloud web app, desktop application, mobile app. Different interfaces do not necessarily offer the same capability. Layer 6 is the work mode: Chat for conversation, questions and quick synthesis; Work or Cowork for fuller tasks and deliverables; Codex or Code for files, code, commands and repositories. Names vary by platform, but the core difference is singular: pure conversation, or the ability to operate on files and tools.",
  m4_highlights: ["Web / Desktop / Mobile", "Unequal Capability", "Chat", "Work / Cowork", "Codex / Code", "Can It Touch Files?"],
  m4_p1: "The practical rule at the interface layer is that Chat and cloud-based work travel comparatively easily across web, desktop and mobile, because they need only an account. Local file operation, by contrast, usually needs the desktop application plus folder permissions granted at the operating-system level. This is why students so often cannot find a feature on their phone: the account is fine, but that capability was never present in the mobile interface. The interface decides what this environment can do, not where your things are.",
  m4_p2: "The mode layer is about different kinds of work inside one interface. Chat suits questions, brainstorming and quick synthesis: cheap and short-turn. Work or Cowork suits fuller tasks, carrying work state and deliverables and advancing across multiple steps. Codex or Code faces the file system and the command line: reading and writing files, running commands, operating on a repository. The difference between them is not that one model is smarter, but that each has been granted different hands and feet.",
  m4_p3: "Crossing layer 5 with layer 6 produces a very useful capability table. The same mode is not equivalent on every interface: a file-operating mode on desktop can read and write folders you have authorised, on the web it can usually only handle files you upload, and on mobile it may not exist at all. When planning work, therefore, the correct question is not \"can this platform do it\" but \"can this platform, on this interface, in this mode, do it\".",
  m4_p4: "The selection principle can stay simple. If the output is a passage of text or an idea, use Chat. If the output is a multi-step task with a defined deliverable, use Work or Cowork. If the output must land in files, code or version control, use a Code-class mode on the desktop application. Decide what the artefact looks like first and the mode chooses itself; pick the mode before you know the artefact and you will usually stall halfway.",
  m4_wrapup: "Layers 5 and 6 determine capability, not location. They are often mistaken for the answer to \"where are my things\", which is really the job of layer 7, the work container. The core test for interface and mode is a single sentence: can this combination operate on files and tools? If yes, you have entered the orange and green world; if no, everything you produce lands in blue cloud records. Confirm capability first, then choose the container, and your workflow will not collapse halfway through.",
  m4_terms: [
    { front: "Work Interface (Layer 5)", back: "Cloud web app, desktop application, mobile app. Different interfaces do not necessarily expose the same capability." },
    { front: "Chat Mode", back: "Conversation, questions and quick synthesis. Short turns, low cost, output is mainly text and ideas." },
    { front: "Work / Cowork Mode", back: "Handles fuller tasks and deliverables, carries work state, and advances across multiple steps." },
    { front: "Codex / Code Mode", back: "Faces files, code, commands and repositories; usually requires the desktop application and local permissions." },
    { front: "Unequal Capability", back: "A mode is not equivalent across web, desktop and mobile; ask \"can this interface, in this mode, do it\"." },
    { front: "The Core Divide", back: "The one fundamental difference between all modes: pure conversation, or the ability to operate on files and tools." }
  ],
  m4_q: [
    { q: "What do layers 5 and 6 jointly determine?", opts: ["Which layer your work content is actually stored in", "What this environment is able to do (capability)", "The amount you pay for your subscription each month", "The context length the model can use in a single turn"], ans: _A1, exp: "Interface and mode determine capability; location belongs to layer 7." },
    { q: "What does local file operation usually require?", opts: ["Signing in to the same paid account is all that is needed", "The desktop interface plus local folder permissions", "Installing the mobile app version is all that is needed", "Only a larger context window limit is needed"], ans: _A1, exp: "File operations demand the desktop application and OS-level authorisation." },
    { q: "What is the main difference between Chat and Work/Cowork?", opts: ["Chat and Work run on completely different base models, hence different power", "Work/Cowork targets fuller tasks and deliverables and carries work state", "Per-call billing for Chat is noticeably higher than it is for Work/Cowork", "Work/Cowork supports a Chinese interface only, while Chat supports many languages"], ans: _A1, exp: "The difference is task completeness and work state, not model intelligence." },
    { q: "What is the core divide between all work modes?", opts: ["How quickly the model responds and how steady that response speed stays", "Pure conversation versus the ability to operate on files and tools", "The interface colour and the styling of the page layout", "Whether voice input and spoken read-back functions are both supported"], ans: _A1, exp: "This is the single fundamental test for classifying a mode." },
    { q: "When planning work, what is the correct way to ask the question?", opts: ["Can this platform, taken as a whole, actually do this", "Can this platform, on this interface, in this mode, do it", "Is this model's reasoning ability really smart enough", "Has this account already been upgraded to a higher paid tier"], ans: _A1, exp: "Interface and mode must be asked together because capability is unequal." },
    { q: "When the output must land in files, code and version control, what is the best choice?", opts: ["The mobile Chat application running on a phone", "A Code-class mode on the desktop application", "The Web version of Chat inside a browser", "Any interface with any mode at all will do the job"], ans: _A1, exp: "File and repository operations need the desktop plus a file-capable mode." }
  ],

  /* ===== M5 ===== */
  m5_nav: "5. Layer 7: The Work Container",
  m5_title: "Layer 7: The Work Container — Where Does Your Work Actually Live?",
  m5_overview: "Layer 7 is the hinge of the whole diagram, because it answers the question people ask most: where does my work actually live? The diagram sets four containers side by side: plain chat (blue), project (blue), local folder (orange) and cloud drive (green). Cloud-type containers continue across devices fairly easily as long as account and workspace match; local-type containers require the other device to have that folder too, and the path to be pointed at again.",
  m5_highlights: ["Plain Chat", "Project", "Local Folder", "Cloud Drive", "Cross-Device Continuity", "Choosing a Container"],
  m5_p1: "Plain chat (blue) is the lightest container: AI cloud chat history that follows account and workspace. It suits one-off questions and exploration. Its weakness is that content is scattered along a timeline with no explicit file structure, so recovering old material depends on search and memory. Many people pile an entire semester of work into one long thread and then live permanently in the state of \"I know I asked this, but I cannot find it\".",
  m5_p2: "A project (blue) is a cloud project space that gathers chats, uploaded files and custom instructions. Compared with plain chat it adds structure and continuity: several conversations inside one project share the same context and instructions, and signing in with the same account and workspace on another device brings it all back. The price is that it still lives in the platform's cloud; it is not the files on your computer and it does not become a version-controlled repository.",
  m5_p3: "A local folder (orange) is the real world of files, for example D:\\Project. Its strengths are that it holds any format, can be used by other software, and can go under version control; its weakness is that it is bound to that one machine, so a change of device means preparing the folder again and repointing the path. A cloud drive (green) sits between the two: still a local folder, but synchronised to other devices through a service such as OneDrive, making cross-device continuity workable at the cost of differing paths, sync delay and the occasional conflict copy.",
  m5_p4: "Choose the container by asking what you are trying to protect. To protect reasoning and context, use a project. To protect files and versions, use a local folder with version control. To move files between two or more machines, use a cloud drive. To ask one quick question, use plain chat and do not build a project for it. The genuinely mature practice is to mix: the project carries context and instructions, the local folder carries files and versions, and an explicit path convention joins the two.",
  m5_wrapup: "Layer 7 is where cloud and local genuinely meet, and it is the layer most worth investing in. None of the four containers is superior; they are merely suited to different things. Blue containers travel across devices easily but are not files. Orange containers are real files but are bound to a machine. Green containers buy continuity with synchronisation and pay for it in paths and conflicts. Build the habit of asking, before any piece of work begins, which container the result should live in. Write the answer down and half of your later trouble disappears.",
  m5_terms: [
    { front: "Plain Chat (Blue)", back: "AI cloud chat history following account and workspace. Lightweight, good for one-off questions, but unstructured." },
    { front: "Project (Blue)", back: "A cloud project space gathering chats, files and custom instructions, giving shared context and better continuity." },
    { front: "Local Folder (Orange)", back: "A folder on one computer, e.g. D:\\Project. Any format, version-controllable, but bound to that machine." },
    { front: "Cloud Drive (Green)", back: "A sync folder such as OneDrive: a local folder plus cross-device synchronisation; the path still differs per machine." },
    { front: "Cross-Device Continuity", back: "Cloud-type containers continue with the same account and workspace; local-type ones need the folder present and the path repointed." },
    { front: "Mixing Strategy", back: "The project carries context and instructions, the local folder carries files and versions, joined by an explicit path convention." }
  ],
  m5_q: [
    { q: "What core question does layer 7, the work container, answer?", opts: ["How intelligent this model really is", "Where your work actually lives", "How much the subscription costs per month", "How long a single turn context is"], ans: _A1, exp: "The work container is precisely the \"where does it live\" layer." },
    { q: "Which pair of containers belongs to blue AI cloud space?", opts: ["Local folder and cloud drive", "Plain chat and project", "Project and local folder", "Cloud drive and plain chat"], ans: _A1, exp: "Both plain chat and project follow account and workspace, so both are blue." },
    { q: "What does a project add compared with plain chat?", opts: ["Noticeably faster model responses plus a much higher per-minute throughput ceiling", "Structure and shared context: chats, files and custom instructions in one place", "Automatic version control and history restore for every file it holds", "Direct read and write access across the entire local file system"], ans: _A1, exp: "Projects add structure, shared instructions and better continuity, but remain in the cloud." },
    { q: "What is the main cost of a local folder?", opts: ["It cannot store large binary files once they go past a fixed size ceiling set by the platform", "It is bound to one machine, so a new device requires preparation and repointing the path", "It cannot apply any form of version control or history restore to the files it contains", "It can store plain text files only and cannot hold any binary files"], ans: _A1, exp: "An orange container is identified by machine and path, so changing machine breaks it." },
    { q: "Compared with a pure local folder, what does a green cloud drive buy and what does it cost?", opts: ["It buys cross-device continuity and costs differing paths, sync delay and conflict copies", "It buys direct read access for the AI platform, and costs read and write speed and latency", "It buys full version control and costs storage capacity and extra fees", "It buys account integration and single sign-on, and costs privacy control"], ans: _A0, exp: "Green buys continuity through sync, but the path still differs per machine and conflicts can appear." },
    { q: "What is the mature container-mixing strategy?", opts: ["Put every material, file and instruction into one single very long conversation", "Project for context and instructions, local folder for files and versions", "Use only the mobile app version to handle all of the work and all the files", "Open up a brand new project space for every single small thing that comes up"], ans: _A1, exp: "Blue holds context, orange holds files, joined by an explicit path convention." }
  ],

  /* ===== M6 ===== */
  m6_nav: "6. Layers 8–9: Task and Context Window",
  m6_title: "Layers 8–9: Task and Context Window",
  m6_overview: "Layer 8 is the task (Task / Chat / Thread): a persistent unit of work, not a single model call. It remembers conversation history, work state, permissions, and possibly a bound working folder. Layer 9 is the context window: the span of context the model can directly see right now. The single most common misconception lives here — treating the context window as storage.",
  m6_highlights: ["Task Is Persistent", "Work State", "Folder Binding", "Context Window", "Compaction & Summary", "Compaction ≠ New Folder"],
  m6_p1: "The point of the task layer is persistence. A task is not one exchange but a line of work that accumulates state: it remembers what you discussed, how far it has got, and what permissions it holds. If the task was opened inside a local project, it is also bound to a specific working folder on that computer, for example C:\\Users\\jimmy\\OneDrive\\Documents\\[TA group meeting]. That binding matters enormously, because it is the real wire between a blue task and orange files.",
  m6_p2: "The context window is a completely different thing. It is the span of content the model can see directly during this generation — a desk, not a filing cabinet. It is not a folder, not a project, and not account storage. When a conversation grows past the limit, the system compacts or summarises earlier material so the most important part stays in view. The model may then lose some detail, but that does not mean your task has ended, and it certainly does not mean your working folder changed.",
  m6_p3: "Separating the two layers explains many apparently contradictory experiences. The model suddenly cannot recall a number from thirty turns ago — that is layer 9 compaction. Yet it can still read and write the folder you authorised and still knows what this task must deliver — that is layer 8, intact. Conversely, if you open a brand-new task, then however long the context window is, it will not inherit the previous task's folder binding and work state, because layer 8 genuinely changed.",
  m6_p4: "Three practical responses follow. First, do not leave important conclusions only in the conversation; write them into project instructions or files so they survive compaction. Second, cut long tasks into explicit stages and close each stage with a written consolidation. Third, when you suspect the model has forgotten, decide first whether this is compaction or a new task: if it is compaction, supply a short summary; if the task changed, re-establish context and re-confirm the folder binding.",
  m6_wrapup: "The boundary between layers 8 and 9 is the easiest one to blur and the one most worth rehearsing. Hold on to two tests: a task is a persistent unit of work carrying state, permissions and folder binding; a context window is only the model's present field of view, which is compacted but never changes your container. After compaction you are usually still in the same task, and that is not the same as changing working folder. Distinguish these reliably and your expectations of AI shift from superstition to predictable engineering judgement.",
  m6_terms: [
    { front: "Task (Layer 8)", back: "Task / Chat / Thread: a persistent unit of work remembering history, work state, permissions and a possible working folder." },
    { front: "Folder Binding", back: "A task opened in a local project binds to a path on that computer — the wire between a blue task and orange files." },
    { front: "Context Window (Layer 9)", back: "The span of context the model can directly see now. Not a folder, not a project, not account storage." },
    { front: "Compaction / Summary", back: "When a conversation runs long, the system compacts or summarises earlier content to keep the most important part in view." },
    { front: "Compaction ≠ New Folder", back: "After compaction you are usually still in the same task; the working folder and permissions are unchanged." },
    { front: "Surviving Compaction", back: "Write key conclusions into project instructions or files rather than leaving them only in the conversation." }
  ],
  m6_q: [
    { q: "What is the most important property of a layer 8 task (Task / Chat / Thread)?", opts: ["It equals one single model call, and every bit of state disappears the moment that call ends", "It is a persistent unit of work carrying state, permissions and possible folder binding", "It exists only in the mobile app, with no equivalent on the desktop", "It equals the context window and is merely another name for the same thing"], ans: _A1, exp: "A task is persistent, not a single call." },
    { q: "What is the context window?", opts: ["The cloud storage quota that is available to this account", "A cloud folder that belongs to this account on the platform", "The span of context the model can directly see right now", "The root directory of a project on the local disk"], ans: _A2, exp: "It is like a desk, not a filing cabinet." },
    { q: "What usually happens after a long conversation triggers compaction or summarisation?", opts: ["This task comes to an end, and the working folder that it was bound to is switched as well too", "It is still the same task with the same working folder, though some detail is out of view", "The account is automatically signed out and you must sign in again before you can continue", "The project, together with all of the files inside it, is deleted by the platform for good"], ans: _A1, exp: "Compaction affects only the layer 9 field of view, not the layer 8 task or the container." },
    { q: "What happens when you open a brand-new task?", opts: ["It automatically inherits the previous folder binding and work state", "It does not automatically inherit folder binding or work state", "It automatically extends the context window available to that task", "It automatically switches to another account or workspace"], ans: _A1, exp: "Layer 8 really changed, so context and binding must be re-established." },
    { q: "If a task was opened inside a local project, what may it be bound to?", opts: ["A specific cloud project on another AI platform entirely", "A specific working folder path on that computer", "The subscription tier that this user is currently using", "The sampling parameters that the model is using now"], ans: _A1, exp: "For example C:\\Users\\jimmy\\OneDrive\\Documents\\[TA group meeting]." },
    { q: "What most effectively lets an important conclusion survive compaction?", opts: ["Pasting the same important conclusion back into the conversation over and over again by hand", "Writing it into project instructions or files rather than leaving it in the conversation", "Switching over to a model that offers a considerably longer context window", "Closing this whole conversation down and then opening it up again later"], ans: _A1, exp: "Only writing it into a container (project or file) carries it past layer 9 compaction." }
  ],

  /* ===== M7 ===== */
  m7_nav: "7. Cross-Device Breakpoint Diagnosis and Three Takeaways",
  m7_title: "Cross-Device Breakpoint Diagnosis and Three Takeaways",
  m7_overview: "Once all nine layers are learned, the most useful output is a diagnostic: when you change computer, walk the layers and ask \"does this layer travel with me?\" The answers are blunt. Layer 1 device, layer 2 user, local-type containers in layer 7, and layer 8 wherever a path is bound — these break. Everything that follows the account generally does not. We close by compressing the whole diagram into three portable conclusions and connecting them to your PMCS term project.",
  m7_highlights: ["Layer-by-Layer Diagnosis", "Four Breakpoints", "Three Takeaways", "Term Project", "Locating the Repo", "Knowledge Base & Memory"],
  m7_p1: "The diagnostic is mechanical, and it is reliable precisely because it is mechanical. Layer 1: does the new machine hold the files and tools I need? If not, broken. Layer 2: who am I on this machine, what do the paths look like, do I have permission? If different, broken. Layers 3 and 4: are platform, account and workspace the same? If yes, intact. Layers 5 and 6: is the desktop application installed and can I enter the mode I need? If not, capability is broken. Layer 7: is the container blue or orange? Blue survives; orange and green must be prepared again and repointed. Layer 8: is the task bound to an old path? If so, rebind. Layer 9: the context window is rebuilt every time, so \"does it travel\" simply does not apply.",
  m7_p2: "Run that diagnostic once and \"changing computer is a pain\" decomposes into four concrete jobs: prepare the local folders, install the tools and desktop application, repoint the paths, and rebind the tasks. Every one of those costs can be lowered in advance: keep folders under sync (green), write the tools into an installation list, replace paths with relative paths or a configuration file, and move the task's key context into project instructions. The pain does not disappear, but it moves from unpredictable to schedulable.",
  m7_p3: "The three takeaways are the compressed version of the whole diagram. One: account and workspace govern cloud records; the device governs local files. Two: projects and working folders are what join cloud work to local files. Three: the context window is only the model's present field of view. Those three sentences cover blue, orange and green, all nine layers, and the single most common misconception. If you can only keep one page, keep these three sentences.",
  m7_p4: "Finally, connect this to the PMCS term project. Your repository is a local-type container in layer 7, usually paired with version control and a remote host, so it inherently depends on layers 1 and 2 being prepared. Your knowledge base, if it is Markdown files, also sits in layer 7 as orange or green; if it lives inside a platform project, it is blue. Your memory mechanisms — custom instructions, project descriptions, long-term preferences — belong to layer 4 and the blue part of layer 7, and follow the account. In your term-project environment note, state explicitly which layer each item belongs to and which colour of space it sits in. That note is itself the evidence of your environment literacy.",
  m7_wrapup: "Layering is not about memorising nine nouns; it is about locating a fault within thirty seconds when something breaks. Learn the diagnostic as a fixed string of questions: Machine? User? Platform? Account and workspace? Interface? Mode? Container? Task binding? Field of view? Ask them in order and the answer surfaces by itself. Then check your plan against the three takeaways: do cloud records follow the account, do files follow the device, are the two joined by a project and a working folder, and have you mistaken the context window for storage? Those four checkpoints are the AI environment literacy you take with you.",
  m7_terms: [
    { front: "Layer-by-Layer Diagnosis", back: "On changing device, asking each layer in turn whether it travels with you, turning vague trouble into schedulable work." },
    { front: "The Four Breakpoints", back: "Layer 1 device, layer 2 user, layer 7 local-type containers, and layer 8 when a path is bound — these break on a machine change." },
    { front: "Takeaway One", back: "Account and workspace govern cloud records; the device governs local files." },
    { front: "Takeaway Two", back: "Projects and working folders join cloud work to local files." },
    { front: "Takeaway Three", back: "The context window is only the model's present field of view." },
    { front: "Term-Project Placement", back: "Repository and Markdown knowledge base are usually layer 7 orange or green; custom instructions and long-term preferences are layer 4 and layer 7 blue." }
  ],
  m7_q: [
    { q: "When you change computer, which group of layers is most likely to break?", opts: ["Layer 3 the platform, plus layer 4 account and plan tiers", "Layers 1 and 2 plus local-type containers in layer 7", "The contents of the layer 9 context window", "Everything except layer 5 interface survives"], ans: _A1, exp: "Only layers that follow machine and path break; those that follow the account generally survive." },
    { q: "What is the status of layer 9, the context window, in a cross-device diagnosis?", opts: ["It travels with that particular piece of device hardware", "It travels along with the account and workspace and is preserved there", "It is rebuilt every time, so \"does it travel\" does not apply", "It is preserved in full by the cloud synchronisation service"], ans: _A2, exp: "The field of view is rebuilt each time; it is not portable storage." },
    { q: "What is the first of the three takeaways?", opts: ["The context window is only the field of view that the model is able to see right now", "Account and workspace govern cloud records; the device governs local files", "Projects and working folders join cloud work and local files together properly", "Interface and mode together determine what this whole environment is able to do"], ans: _A1, exp: "The first sentence divides the work between blue and orange." },
    { q: "In the three takeaways, what does the joining?", opts: ["The paid subscription plan tier", "Projects and working folders", "The mobile app interface", "The current context field of view"], ans: _A1, exp: "Takeaway two: projects and working folders join cloud work to local files." },
    { q: "In the PMCS term project, a Markdown knowledge base kept in a sync folder belongs to which space?", opts: ["Blue AI cloud space, which follows your account", "Green cloud-drive sync (still local in nature)", "Layer 9, the context window itself", "None of the space types listed above"], ans: _A1, exp: "A sync folder is green, and green is still local files underneath." },
    { q: "What is the key to making a machine change schedulable?", opts: ["Downgrading to a completely free plan so that the account and the device stop being tied to any single platform at all any more", "Lowering the four breakpoint costs in advance: sync folders, install lists, relative paths, context in project instructions", "Working only on a phone in order to avoid every local path and installation problem entirely", "Extending the context window all the way up to the largest limit that your own plan allows for"], ans: _A1, exp: "The pain does not disappear, but it moves from unpredictable to schedulable." }
  ],

/* ---------- M1：三種空間並列圖 ---------- */
const SvgThreeSpaces = ({ lang }) => {
  const zh = lang === 'zh';
  const boxes = [

/* ==================== FlipCardDeck ==================== */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());

  const [shuffledOrder] = useState(() =>
    [...Array(terms.length).keys()].sort(() => Math.random() - 0.5)
  );

  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);

  useEffect(() => {
    const newShown = new Set(shownSet);
    currentCardIndices.forEach(idx => newShown.add(idx));
    if (newShown.size !== shownSet.size) setShownSet(newShown);
  }, [groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const newRead = new Set(readSet); newRead.add(origIdx); setReadSet(newRead);
      if (onCardRead) onCardRead(moduleId, newRead.size, shownSet.size, terms.length);
    }
  };

  const statusText = t.flip_status
    .replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(origIdx)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }}
          className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
          {t.flip_retry}
        </button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)}
          disabled={groupIdx >= totalGroups - 1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
          {t.flip_next}
        </button>
      </div>
    </div>
  );
};

/* ==================== ModuleQuiz ==================== */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;

  const [quizIndices] = useState(() =>
    [...Array(questions.length).keys()].sort(() => Math.random() - 0.5)
  );
  const totalGroups = Math.ceil(quizIndices.length / groupSize);

  const [shuffledMaps] = useState(() =>
    quizIndices.map(qIdx => {
      const n = questions[qIdx].opts.length;
      return [...Array(n).keys()].sort(() => Math.random() - 0.5);
    })
  );

  const totalAnswered = Object.keys(selected).length;
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status
    .replace('{correct}', computeCorrect())
    .replace('{answered}', totalAnswered)
    .replace('{total}', quizIndices.length);

  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);

  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    setSubmitted(s => ({ ...s, [groupIdx]: true }));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrongQs = [];
      let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
        else wrongQs.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName);
    }
  };

  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm
                      ${isGrpSub
                        ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30 dark:border-green-500'
                          : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30 dark:border-red-500' : 'border-slate-200 dark:border-slate-700'
                        : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/10' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'
                      }`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${
                shuffledMaps[qi][selected[qi]] === _d(q.ans)
                  ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'
              }`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans)
                  ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}: {q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit}
              disabled={!currentIndices.every((_, i) => selected[currentStart + i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">
              {t.submit}
            </button>
          : <>
              {groupIdx < totalGroups - 1 && (
                <button onClick={() => setGroupIdx(groupIdx + 1)}
                  className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">
                  {t.quiz_next}
                </button>
              )}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
                className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">
                {t.quiz_retry}
              </button>
            </>
        }
      </div>
    </div>
  );
};
